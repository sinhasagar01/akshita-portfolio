theme: ink-flare
heroCopy: Akshita Singh
heroTabs:
  - label: Who I am
    headline: A product designer who turns rough ideas into products people *use*.
    support: >-
      Six years across enterprise data tools and one consumer turnaround. Most
      of the work happens before anything is drawn.
    callouts:
      - Enterprise UX
      - Design systems
      - Research-led
    stats:
      - value: '6'
        unit: years
      - value: '4'
        unit: case studies
      - value: '2'
        unit: companies
  - label: What I do
    headline: End-to-end design for *data-dense* tools.
    support: >-
      Research through to shipped interface, personas, flows, systems, and the
      engineering conversations that keep them intact.
    callouts:
      - Personas ×3
      - Flows
      - Tokens
    stats:
      - value: '3'
        unit: personas
      - value: '40'
        unit: '% faster'
      - value: '35'
        unit: '% adoption'
  - label: How I work
    headline: Close to research. Closer to *engineering*.
    support: >-
      A rating of 2.3 is a completion number wearing a satisfaction number. The
      job is finding which failure it is about.
    callouts:
      - Measure first
      - Test with people
      - Ship, re-measure
    stats:
      - value: '80'
        unit: '% completion'
      - value: '25'
        unit: '% retention'
      - value: '42'
        unit: rating ×10
  - label: What I'm up to
    headline: Open to roles, and *writing* about motion.
    support: >-
      Currently at Fosfor on Elevate ONE View. Writing about what motion is for,
      and what you learn by removing it.
    callouts:
      - Fosfor · Elevate
      - Writing
      - Open to roles
    stats:
      - value: '3'
        unit: posts
      - value: '4'
        unit: studies
      - value: '1'
        unit: turnaround
