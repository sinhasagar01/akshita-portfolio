aboutCopy: >
  I turn rough ideas into products people actually use.


  Seven years across SaaS, e-commerce, and enterprise. Right now, I am at
  **LTIMindtree**, designing a mechanic-first app for Elevate, after shaping
  fitness wearables, AI data platforms, and point-of-sale systems used by more
  than **20,000 merchants**, with a Design Innovation Award along the way.
aboutNote: >-
  The same curiosity that gets me painting under a tree is the one I bring to a
  blank product to canvas.
aboutFocusChips:
  - User-centered design
  - Prototyping
  - Design systems
  - 0 to 1 products
aboutSubtext: Seven years turning rough ideas into products people actually use.
aboutPhotoCaption: off the clock, painting under a tree
processStages:
  - name: Discover
    description: I sit with the ambiguity, talk to people, and map what is really going on.
    tags:
      - interviews
      - research
      - audits
  - name: Define
    description: I narrow it to the real problem, the people, and the scope.
    tags:
      - personas
      - journeys
      - scope
  - name: Design
    description: I shape it, from rough wireframes to a working prototype.
    tags:
      - wireframes
      - prototypes
      - systems
  - name: Validate
    description: I put it in front of people, refine, and measure the impact.
    tags:
      - usability tests
      - iteration
      - handoff
