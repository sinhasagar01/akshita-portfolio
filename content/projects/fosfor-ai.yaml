  - variant: default
    id: setup
    index: '01'
    eyebrow: The setup
    title: |-
      One companion,
      three very different people.
    lead: >-
      Enterprise AI isn't challenging because of the technology—it's challenging
      because every user expects something different.


      Inside Fosfor Decision Cloud, one AI companion had to support three
      distinct personas, each with different goals, workflows, and definitions
      of success. Designing a single experience that felt intelligent to all of
      them became the core challenge of this project.
    northStar: ''
    layout: stack
    glow:
      text: companion
      top: ''
      right: ''
      bottom: '-30px'
      left: 30px
      size: clamp(5rem, 11vw, 9rem)
    blocks:
      - discriminant: pullQuote
        value:
          text: >-
            One companion had to serve three very different people, the one
            preparing data, the one finding insight in it, and the one making
            the call, each with their own idea of what help looks like.
      - discriminant: glanceGrid
        value:
          items:
            - label: Product
              value: Fosfor AI, an AI companion built into the Fosfor Decision Cloud.
            - label: Problem
              value: >-
                Users across very different roles struggled to navigate complex
                data workflows and pull out insight they could act on.
            - label: Details
              value: >-
                UI and UX design across research, architecture, and prototyping
                over twelve weeks.
            - label: Solution
              value: >-
                An AI guided companion that supports three personas while
                keeping data secure and trusted.
            - label: Result
              value: >-
                A single intelligent layer across the whole data to decision
                journey.
