  - variant: default
    id: setup
    index: '01'
    eyebrow: The setup
    title: |-
      One companion,
      three very different people.
    lead: >-
      Enterprise AI isn't difficult because of the technology—it's difficult
      because every user expects something different.


      Inside Fosfor Decision Cloud, one AI companion had to support three
      distinct personas with different goals, workflows, and definitions of
      success. Designing one experience that felt intelligent to all of them
      became the core challenge of this project.
    northStar: ''
    layout: stack
    glow:
      text: companion
      top: ''
      right: ''
      bottom: '-30px'
      left: 30px
      size: clamp(5rem, 11vw, 9rem)
    blocks:
      - discriminant: pullQuote
        value:
          text: >-
            The challenge wasn't designing one AI assistant. It was designing
            one assistant that could think differently for three completely
            different people—without making any of them feel like the product
            wasn't built for them.
      - discriminant: glanceGrid
        value:
          items:
            - label: Opportunity
              value: >-
                Create one AI companion that could adapt to different workflows
                without forcing users to change how they work.
            - label: Challenge
              value: >-
                Each persona solved different problems, making a single,
                one-size-fits-all AI experience ineffective.
            - label: My Contribution
              value: >-
                Defined the AI experience strategy, led user research, designed
                the interaction model, and collaborated closely with engineering
                to bring the product to life.
            - label: Design Approach
              value: >-
                Embedded contextual AI directly into existing workflows, making
                assistance available exactly when users needed it.
            - label: Outcome
              value: >-
                Established a reusable AI interaction framework that delivered a
                consistent experience across three personas while scaling with
                the Decision Cloud ecosystem.
