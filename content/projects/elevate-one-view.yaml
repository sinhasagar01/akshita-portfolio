    eyebrow: The problem
    title: |-
      Friction in exactly the moments
      a mechanic needed speed.
    lead: ''
    northStar: ''
    layout: stack
    glow:
      text: friction
      top: ''
      right: ''
      bottom: '-20px'
      left: 36px
      size: clamp(5rem, 11vw, 9rem)
    blocks:
      - discriminant: pullQuote
        value:
          text: >-
            When technicians arrived on-site, they weren't thinking about the
            app. They were thinking about diagnosing equipment, keeping
            customers informed, and completing work efficiently.
      - discriminant: richText
        value:
          paragraphs:
            - >-
              Instead of supporting those moments, the product often introduced
              unnecessary friction through inconsistent interactions, fragmented
              navigation, and unclear information hierarchy. The problem wasn't
              missing features. It was interrupting the work.
            - The problem wasn't missing features. It was interrupting the work.
