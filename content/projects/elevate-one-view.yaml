  - variant: default
    id: setup
    index: '01'
    eyebrow: THE SETUP
    title: |-
      The app a mechanic carries
      into the field.
    lead: >-
      Elevate is one of the world's leading elevator and escalator companies,
      and this was an industry project delivered with LTIMindtree. **Elevate ONE
      View** is the app field mechanics carry, the critical enabler for the IoT
      platform out in the field.
    northStar: ''
    layout: stack
    glow:
      text: onsite
      top: ''
      right: ''
      bottom: '-30px'
      left: 30px
      size: clamp(5rem, 11vw, 9rem)
    blocks:
      - discriminant: richText
        value:
          paragraphs:
            - >-
              Its job is to digitise and manage the full lifecycle of an
              elevator's connectivity, commissioning, troubleshooting,
              maintenance, and access to real time health data. Because it is an
              industry project, the designs stay limited here for
              confidentiality, so this study leans on the story more than the
              screens.
      - discriminant: glanceGrid
        value:
          items:
            - label: Product
              value: >-
                Elevate ONE View, the primary mobile interface for Elevate field
                mechanics, and the field side of an IoT platform.
            - label: Problem
              value: >-
                A heavy, inconsistent app made commissioning and maintaining
                elevators slow and error prone in the field.
            - label: Details
              value: >-
                UX and UI designer on a cross functional team of 35, owning the
                design system and the 2.0 redesign over six months.
            - label: Solution
              value: >-
                A single, simplified workflow for the full lifecycle of an
                elevator's connectivity, from commissioning to troubleshooting.
            - label: Result
              value: >-
                A decluttered first version that streamlined the core flow and
                helped win the business.
