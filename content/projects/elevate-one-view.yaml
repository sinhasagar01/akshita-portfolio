        value:
          heading: ''
          subhead: ''
          cards:
            - index: '01'
              title: The basics come first
              body: >-
                The app did not adapt to different screens, so layouts broke and
                the basics had to come first.
            - index: '02'
              title: Consistency is familiarity
              body: >-
                Components behaved inconsistently across the app, which made
                every screen feel unfamiliar.
            - index: '03'
              title: Navigation over features
              body: >-
                Navigation felt heavy and disconnected, so a clear, consistent
                structure mattered more than any single feature.
