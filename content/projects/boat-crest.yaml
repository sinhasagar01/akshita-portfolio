    title: |-
      Great hardware,
      a neglected app.
    lead: >-
      boAt is one of India's biggest consumer-electronics brands, built on
      affordable, stylish audio and a fast-growing line of smartwatches. **boAt
      Crest** is the companion app that pairs with those watches to track
      fitness, health and daily activity. By the time this redesign began, the
      app had fallen behind the hardware. The watches sold well, but the
      companion felt cluttered and dated, and the store rating showed it.
