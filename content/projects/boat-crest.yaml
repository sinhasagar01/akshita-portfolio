  - variant: default
    id: reflection
    index: '08'
    eyebrow: Reflection
    title: What I learned, and what I'd test next.
    lead: >-
      Redesigning a shipped app meant respecting what already worked while being
      honest about what didn't. The biggest lesson was **restraint**. The
      hardest cuts, the upsell nags and the fifth tab, did the most for clarity.
      The rating moving from **2.3 to 4.2** told me the hardware was never the
      problem. The experience was.
    northStar: ''
