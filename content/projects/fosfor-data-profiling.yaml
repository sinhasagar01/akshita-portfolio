      size: clamp(5rem, 11vw, 9rem)
    blocks:
      - discriminant: pullQuote
        value:
          text: >-
            Before this, understanding a dataset's quality meant slow manual
            inspection, which was time consuming and easy to get wrong. Teams
            carried flawed data into analysis without knowing it, and wrong data
            quietly became wrong conclusions.
      - discriminant: figureGrid
