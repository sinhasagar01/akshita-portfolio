  - variant: default
    id: setup
    index: '01'
    eyebrow: The setup
    title: |-
      The step that decides
      whether data can be trusted.
    lead: >-
      Fosfor is LTIMindtree's data and decision platform, a suite that helps
      organisations move from raw data to confident decisions. **Data
      profiling** is the step that comes first, the work of checking whether a
      dataset is even worth trusting.
    northStar: ''
    layout: stack
    glow:
      text: quality
      top: ''
      right: ''
      bottom: '-30px'
      left: 30px
      size: clamp(5rem, 11vw, 9rem)
    blocks:
      - discriminant: richText
        value:
          paragraphs:
            - >-
              It computes statistical metrics across a data model to expose
              structure, quality, and anomalies before anyone builds analysis on
              top of it. My job was to make that step fast, legible, and built
              into the flow rather than a chore done by hand.
      - discriminant: glanceGrid
        value:
          items:
            - label: Product
              value: >-
                Data profiling inside the Fosfor Decision Cloud, the suite that
                turns data into decisions.
            - label: Problem
              value: >-
                Teams could not easily judge the quality or structure of a
                dataset before analysing it, so flawed data slipped through.
            - label: Details
              value: >-
                UI and UX design across research, structure, and visual design
                over four months in Figma.
            - label: Solution
              value: >-
                A clean profiling interface that computes statistical metrics on
                any data model and surfaces issues at a glance.
            - label: Result
              value: >-
                A faster, more trustworthy first step in the data to decision
                workflow.
      - discriminant: figureGrid
        value:
          heading: ''
          items:
            - image:
                src: >-
                  /images/projects/fosfor-data-profiling/profiling-techniques.webp
                alt: >-
                  A tree of data profiling techniques, single field methods like
                  summary statistics and distributions, and multiple field
                  methods like dependencies and relationships
                width: null
                rotate: null
                translateX: null
                translateY: null
                z: null
              title: ''
              body: >-
                Profiling splits into single field methods (summary statistics,
                data types, values, and distributions) and multiple field
                methods that surface dependencies and relationships across
                columns.
