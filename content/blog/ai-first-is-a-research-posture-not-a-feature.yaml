title: AI first is a research posture, not a feature
dek: Most AI features are a second route to a screen that already existed.
date: '2026-07-27'
topic: AI in product
status: draft
heroImage: /images/blog/ai-first-is-a-research-posture-not-a-feature/heroImage.webp
blocks:
  - discriminant: richText
    value:
      paragraphs:
        - >-
          The pattern is easy to recognise once you have shipped it. A product
          exists, a model becomes available, and somebody adds a box in the
          corner where the user can type a question. The box is real work. It
          ships. It demos well.


          Then you watch the analytics and almost nobody opens it, and the
          people who do ask it to describe the screen they are already looking
          at.
  - discriminant: heading
    value:
      text: Why the box does not work
  - discriminant: richText
    value:
      paragraphs:
        - >-
          A bolted on assistant asks the user to already know what to ask. That
          is a strange request, because the reason someone opens an enterprise
          tool is usually that they do not yet know the shape of their own
          question.


          It also leaves the original flow untouched. Every step that existed
          before still exists. So the assistant becomes a parallel route to the
          same screen, and a slower one, because now there is a sentence to
          compose.
  - discriminant: imageBlock
    value:
      src: >-
        /images/blog/ai-first-is-a-research-posture-not-a-feature/blocks/d9517012efd9.webp
      alt: >-
        Two versions of the same task. In the first, five steps run left to
        right with an assistant hanging off the middle. In the second, three of
        the steps collapse into one.
      caption: The box adds a path. It does not remove one.
      wide: false
      decorative: true
