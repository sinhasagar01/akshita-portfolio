<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mobile hero — reveal concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root{
    --tan:#E4DCCB;--paper:#FBF6EE;--ink:#1C1815;--mut:#7C7267;--faint:#A3998A;
    --line:rgba(60,50,38,.15);--acc:#B4562F;--word-light:rgba(226,183,161,.5);
    --serif:'Fraunces',Georgia,serif;--script:'Yellowtail',cursive;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --b-red:236,58,35;--b-heart:255,77,109;--b-cyan:59,201,255;
    --e-steel:110,128,168;--e-indigo:91,107,229;--wave:46,26,71; /* #2e1a47 */
    --expo:cubic-bezier(.16,1,.3,1);--back:cubic-bezier(.34,1.5,.5,1);--soft:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .sf{font-family:var(--serif);}
  .eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--acc);font-weight:500;}

  .bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:600;display:flex;gap:12px;align-items:center;
       background:rgba(252,248,241,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
       border:.5px solid var(--line);border-radius:999px;padding:7px 9px;box-shadow:0 18px 44px -20px rgba(60,50,38,.5);}
  .grp{display:flex;gap:5px;align-items:center;}
  .grp b{font-family:var(--serif);font-weight:400;font-size:12.5px;margin:0 4px 0 8px;}
  .bar button{font-size:11.5px;border:.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;transition:.2s;white-space:nowrap;}
  .bar button.on{background:var(--acc);color:#fff;border-color:var(--acc);}
  .bar .replay{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:500;}
  .sep{width:.5px;height:22px;background:var(--line);}

  .cap{position:fixed;left:22px;bottom:22px;z-index:600;max-width:330px;background:rgba(252,248,241,.86);
       -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:.5px solid var(--line);border-radius:18px;
       padding:16px 19px;box-shadow:0 20px 50px -22px rgba(60,50,38,.45);}
  .cap .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:6px;}
  .cap .t{font-family:var(--serif);font-size:18px;margin:0 0 4px;}
  .cap p{margin:0;font-size:12.5px;line-height:1.5;color:var(--mut);}

  .hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:104px 56px 90px;}
  .csGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.98fr);gap:52px;align-items:center;width:100%;max-width:1180px;margin:0 auto;}
  .csCopy{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .kicker{display:flex;align-items:center;gap:13px;justify-content:center;}
  .kicker em{display:block;width:42px;height:1.5px;background:var(--acc);}
  .hero h1{font-family:var(--serif);font-weight:400;letter-spacing:-.022em;font-size:clamp(44px,6vw,84px);line-height:.96;margin:14px 0 0;}
  .tagWrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;margin-top:22px;min-height:120px;}
  .backdrop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;}
  .backdrop span{font-family:var(--script);color:var(--word-light);font-size:clamp(84px,11vw,170px);white-space:nowrap;line-height:1;}
  .tag{position:relative;z-index:1;margin:0;font-family:var(--serif);font-style:italic;color:var(--acc);font-size:clamp(23px,2.9vw,38px);max-width:20ch;line-height:1.15;}
  .blurb{color:var(--mut);font-size:clamp(14px,1.15vw,17px);max-width:44ch;margin:16px 0 0;}
  .facts{display:grid;grid-template-columns:1fr 1fr;margin-top:26px;width:100%;max-width:440px;border-top:.5px solid var(--line);}
  .facts .f{padding:12px 16px;text-align:center;border-bottom:.5px solid var(--line);}
  .facts .f:nth-child(even){border-left:.5px solid var(--line);}
  .facts .k{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:3px;}
  .facts .v{font-size:12.5px;font-weight:500;}

  .stage{position:relative;height:clamp(440px,52vw,600px);display:flex;align-items:center;justify-content:center;isolation:isolate;}
  .aura{position:absolute;inset:-14% -8%;z-index:0;pointer-events:none;opacity:0;}
  .aura b{position:absolute;display:block;border-radius:50%;top:50%;left:50%;}
  .ph{position:absolute;border-radius:34px;background:#0f0d0b;padding:7px;box-shadow:0 40px 80px -34px rgba(28,24,21,.55);opacity:0;}
  .ph .scr{border-radius:27px;overflow:hidden;height:100%;padding:15px 12px;background:#141210;}
  .ph.back{width:clamp(176px,20vw,232px);height:clamp(360px,42vw,486px);z-index:1;transform:rotate(-9deg) translate(-56%,4%);}
  .ph.front{width:clamp(196px,22vw,258px);height:clamp(392px,45vw,532px);z-index:2;transform:rotate(4deg) translate(15%,-2%);}
  .row{background:rgba(255,255,255,.08);border-radius:9px;margin-bottom:8px;}
  .lbl{height:7px;width:52%;background:rgba(255,255,255,.26);border-radius:4px;margin-bottom:11px;}
  .acc{border-radius:9px;}
  [data-cs="boat"] .acc{background:rgba(var(--b-red),.9);}
  [data-cs="boat"] .ring{aspect-ratio:1;border-radius:50%;border:9px solid rgba(var(--b-red),.85);border-right-color:rgba(var(--b-red),.2);border-bottom-color:rgba(var(--b-red),.2);margin:2px auto 10px;width:64%;transform:rotate(-30deg);}
  [data-cs="elevate"] .acc{background:rgba(var(--e-indigo),.9);}
  [data-cs="elevate"] .dot{width:8px;height:8px;border-radius:50%;background:rgba(45,196,180,1);display:inline-block;margin-right:8px;box-shadow:0 0 8px rgba(45,196,180,.9);}
  [data-cs="elevate"] .stat{display:flex;align-items:center;height:34px;padding:0 11px;background:rgba(255,255,255,.06);border-radius:9px;margin-bottom:8px;}
  [data-cs="elevate"] .stat i{flex:1;height:6px;background:rgba(255,255,255,.22);border-radius:3px;}

  /* ===== the two finalised auras ===== */
  .aura.pulse .p1{width:480px;height:480px;margin:-250px 0 0 -240px;filter:blur(36px);background:radial-gradient(closest-side,rgba(var(--b-red),.28) 0%,rgba(var(--b-red),.28) 20%,transparent 74%);animation:beat 2.6s var(--back) infinite;}
  .aura.pulse .p2{width:300px;height:300px;margin:-200px 0 0 -150px;filter:blur(18px);background:radial-gradient(closest-side,rgba(var(--b-heart),.48) 0%,rgba(var(--b-heart),.48) 20%,transparent 72%);animation:beat 2.6s var(--back) .06s infinite;}
  .aura.pulse .p3{width:240px;height:240px;margin:-20px 0 0 -250px;filter:blur(24px);background:radial-gradient(closest-side,rgba(var(--b-cyan),.2),transparent 70%);}
  @keyframes beat{0%,100%{transform:scale(1);opacity:.82}18%{transform:scale(1.05);opacity:1}30%{transform:scale(1);opacity:.9}44%{transform:scale(1.07);opacity:1}60%{transform:scale(1);opacity:.82}}
  .aura.signal .field{width:520px;height:460px;margin:-250px 0 0 -260px;filter:blur(32px);background:radial-gradient(closest-side,rgba(var(--e-steel),.2),transparent 72%);}
  .aura.signal .core{width:260px;height:260px;margin:-190px 0 0 -120px;filter:blur(16px);opacity:.55;background:radial-gradient(closest-side,rgb(var(--wave)) 0%,rgba(var(--wave),.55) 16%,transparent 70%);}
  .aura.signal .ping{width:130px;height:130px;margin:-170px 0 0 -65px;border:2px solid rgba(var(--wave),.62);animation:ping 3.4s ease-out infinite;}
  .aura.signal .ping.d2{animation-delay:1.15s;}.aura.signal .ping.d3{animation-delay:2.3s;}
  @keyframes ping{0%{transform:scale(.4);opacity:0}12%{opacity:.85}100%{transform:scale(3.2);opacity:0}}
  [data-cs="boat"] .ph{box-shadow:0 40px 80px -34px rgba(28,24,21,.55),0 20px 56px -18px rgba(var(--b-red),.4);}
  [data-cs="elevate"] .ph{box-shadow:0 40px 80px -34px rgba(28,24,21,.55),0 20px 56px -18px rgba(var(--wave),.5);}

  /* ============ REVEAL CONCEPTS ============
     Each concept animates the phones from an entrance state to their RESTING transform
     (which equals .ph.back / .ph.front above). animation-fill-mode:both holds the start
     frame before play and the resting frame after. The aura + copy resolve after. */
  .stage.play .ph.back{animation-fill-mode:both;}
  .stage.play .ph.front{animation-fill-mode:both;}
  .stage.play .aura{animation:auraIn .9s ease forwards .5s;}
  @keyframes auraIn{to{opacity:1;}}
  /* copy */
  .csCopy > *{opacity:0;}
  .stage.play ~ x{} /* noop */

  /* A · Stacked-Card Opening — the pair starts as a squared-up deck at centre, then fans
       open to its resting tilt with a light overshoot. */
  .concept-A.play .ph.back{animation:A-back .85s var(--back) forwards;}
  .concept-A.play .ph.front{animation:A-front .9s var(--back) .05s forwards;}
  @keyframes A-back{0%{transform:rotate(-3deg) translate(-14%,3%) scale(.96);opacity:0}22%{opacity:1}100%{transform:rotate(-9deg) translate(-56%,4%) scale(1);opacity:1}}
  @keyframes A-front{0%{transform:rotate(3deg) translate(2%,-1%) scale(.98);opacity:0}22%{opacity:1}100%{transform:rotate(4deg) translate(15%,-2%) scale(1);opacity:1}}

  /* B · Rise & Settle — the refined current motion. Phones rise from below through a soft
       blur, the front leading, and settle with a whisper of overshoot. */
  .concept-B.play .ph.back{animation:B-back .95s var(--expo) .06s forwards;}
  .concept-B.play .ph.front{animation:B-front .95s var(--expo) forwards;}
  @keyframes B-back{0%{transform:rotate(-9deg) translate(-56%,22%) scale(.98);opacity:0;filter:blur(7px)}55%{opacity:1}100%{transform:rotate(-9deg) translate(-56%,4%) scale(1);opacity:1;filter:blur(0)}}
  @keyframes B-front{0%{transform:rotate(4deg) translate(15%,28%) scale(.98);opacity:0;filter:blur(9px)}55%{opacity:1}100%{transform:rotate(4deg) translate(15%,-2%) scale(1);opacity:1;filter:blur(0)}}

  /* C · Deal-In — the two phones are dealt onto the surface from opposite corners with a
       stagger, like laying down two cards. */
  .concept-C.play .ph.back{animation:C-back .8s var(--soft) forwards;}
  .concept-C.play .ph.front{animation:C-front .8s var(--soft) .16s forwards;}
  @keyframes C-back{0%{transform:rotate(-26deg) translate(-96%,42%) scale(.9);opacity:0}30%{opacity:1}100%{transform:rotate(-9deg) translate(-56%,4%) scale(1);opacity:1}}
  @keyframes C-front{0%{transform:rotate(22deg) translate(74%,46%) scale(.9);opacity:0}30%{opacity:1}100%{transform:rotate(4deg) translate(15%,-2%) scale(1);opacity:1}}

  /* copy resolves up in sync (shared across concepts) */
  .stage.play ~ .copyDriver{} /* placeholder */
  .csCopy.play > *{animation:copyUp .7s var(--expo) forwards;}
  .csCopy.play > *:nth-child(1){animation-delay:.05s}
  .csCopy.play > *:nth-child(2){animation-delay:.12s}
  .csCopy.play > *:nth-child(3){animation-delay:.2s}
  .csCopy.play > *:nth-child(4){animation-delay:.28s}
  .csCopy.play > *:nth-child(5){animation-delay:.36s}
  @keyframes copyUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}

  @media (max-width:1000px){.csGrid{grid-template-columns:1fr;gap:30px}.hero{padding:96px 22px 70px}.stage{height:440px}.cap{display:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .ph,.csCopy>*{opacity:1!important}.aura{opacity:1!important}
  }
</style>
</head>
<body data-cs="boat">

<div class="bar">
  <div class="grp"><b>Study</b>
    <button data-cs="boat" class="on">boAt</button>
    <button data-cs="elevate">Elevate</button>
  </div>
  <span class="sep"></span>
  <div class="grp" id="concepts"><b>Reveal</b>
    <button data-c="A" class="on">Stacked-Card</button>
    <button data-c="B">Rise &amp; Settle</button>
    <button data-c="C">Deal-In</button>
  </div>
  <span class="sep"></span>
  <button class="replay" id="replay">↻ Replay</button>
</div>

<div class="cap" id="cap"></div>

<header class="hero">
  <div class="csGrid">
    <div class="csCopy" id="copy"></div>
    <div class="stage concept-A" id="stage">
      <div class="aura" id="aura"></div>
    </div>
  </div>
</header>

<script>
const CONCEPT = {
  A:{n:'Stacked-Card Opening', d:'The pair begins as a squared-up deck at centre, then fans open to its resting tilt with a light overshoot. Playful, tactile, product-launch energy.'},
  B:{n:'Rise & Settle', d:'The refined version of the current motion. Phones rise from below through a soft blur, front leading, settling with a whisper of overshoot. Calm and premium.'},
  C:{n:'Deal-In', d:'The two phones are dealt onto the surface from opposite corners with a stagger, like laying down two cards. Confident and kinetic.'},
};
const COPY = {
  boat:{eyebrow:'Case study · Product design',h1:'boAt Crest',word:'crest',tag:'Making the app worthy of the watch.',
    blurb:"A ground-up redesign of boAt's smartwatch companion app into a calm, personal system people actually want to open.",
    facts:[['My role','Sole product designer'],['Scope','Research · UX · UI'],['Platform','iOS · Android'],['Timeline','2024']]},
  elevate:{eyebrow:'Case study · Product design',h1:'Elevate ONE View',word:'elevate',tag:'Bringing elevators online, anywhere in the world.',
    blurb:'The mobile interface field mechanics use to commission and maintain Elevate elevators worldwide.',
    facts:[['My role','UX and UI · design system'],['Scope','Enterprise mobile app'],['Platform','Mobile'],['Timeline','6 months']]},
};
const AURA = {boat:'pulse', elevate:'signal'};
const AURA_HTML = {
  pulse:'<b class="p1"></b><b class="p2"></b><b class="p3"></b>',
  signal:'<b class="field"></b><b class="core"></b><b class="ping"></b><b class="ping d2"></b><b class="ping d3"></b>',
};
const PHONES = {
  boat:`
    <div class="ph back"><div class="scr"><div class="lbl"></div><div class="row" style="height:58px"></div><div class="acc" style="height:36px;margin-bottom:8px"></div><div class="row" style="height:50px"></div><div class="row" style="height:50px"></div><div class="row" style="height:70px"></div></div></div>
    <div class="ph front"><div class="scr"><div class="lbl" style="width:38%"></div><div class="ring"></div><div style="display:flex;gap:8px;margin-bottom:8px"><div class="row" style="flex:1;height:56px;margin:0"></div><div class="row" style="flex:1;height:56px;margin:0"></div></div><div class="row" style="height:64px"></div><div class="acc" style="height:42px"></div></div></div>`,
  elevate:`
    <div class="ph back"><div class="scr"><div class="lbl"></div><div class="stat"><span class="dot"></span><i></i></div><div class="stat"><span class="dot"></span><i></i></div><div class="stat"><span class="dot"></span><i></i></div><div class="row" style="height:70px"></div><div class="acc" style="height:34px"></div></div></div>
    <div class="ph front"><div class="scr"><div class="lbl" style="width:44%"></div><div class="row" style="height:52px"></div><div class="stat"><span class="dot"></span><i></i></div><div class="stat"><span class="dot"></span><i></i></div><div class="row" style="height:96px"></div><div class="acc" style="height:42px"></div></div></div>`,
};

const body=document.body, stage=document.getElementById('stage'), aura=document.getElementById('aura'),
      copy=document.getElementById('copy'), cap=document.getElementById('cap'), concepts=document.getElementById('concepts');
let cs='boat', c='A';

function renderCopy(){
  const d=COPY[cs];
  copy.innerHTML=`
    <div class="kicker eyebrow"><em></em> ${d.eyebrow}</div>
    <h1 class="sf">${d.h1}</h1>
    <div class="tagWrap"><div class="backdrop"><span>${d.word}</span></div><p class="tag">${d.tag}</p></div>
    <p class="blurb">${d.blurb}</p>
    <div class="facts">${d.facts.map(f=>`<div class="f"><div class="k">${f[0]}</div><div class="v">${f[1]}</div></div>`).join('')}</div>`;
}
function build(){
  body.dataset.cs=cs;
  aura.className='aura '+AURA[cs]; aura.innerHTML=AURA_HTML[cs];
  stage.querySelectorAll('.ph').forEach(p=>p.remove());
  stage.insertAdjacentHTML('beforeend',PHONES[cs]);
  cap.innerHTML=`<div class="k">Reveal concept</div><p class="t">${CONCEPT[c].n}</p><p>${CONCEPT[c].d}</p>`;
  renderCopy();
}
function play(){
  stage.classList.remove('play'); copy.classList.remove('play');
  stage.className='stage concept-'+c;
  void stage.offsetWidth; // reflow to restart animations
  stage.classList.add('play'); copy.classList.add('play');
}
function full(){ build(); play(); }

document.querySelectorAll('.bar .grp:first-child button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.bar .grp:first-child button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); cs=b.dataset.cs; full();
});
concepts.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  concepts.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); c=b.dataset.c; full();
});
document.getElementById('replay').onclick=play;

build(); play();
</script>
</body>
</html>
