<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mobile hero — glow directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fraunces = stand-in for the project's real serif token. Yellowtail = stand-in for the SCRIPT face. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root{
    --tan:#E4DCCB;--paper:#FBF6EE;--ink:#1C1815;--mut:#7C7267;--faint:#A3998A;
    --line:rgba(60,50,38,.15);
    --acc:#B4562F;--peach:#E7B79E;
    --serif:'Fraunces',Georgia,serif;
    --script:'Yellowtail',cursive;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
    --word-light:rgba(226,183,161,.5);

    /* boAt palette (from lib/case-studies/boat-crest.ts swatches) */
    --b-red:236,58,35;--b-heart:255,77,109;--b-cyan:59,201,255;--b-violet:167,139,250;--b-indigo:79,70,229;
    /* Elevate cool set — steel / indigo / signal-teal, kept desaturated + premium */
    --e-indigo:91,107,229;--e-steel:110,128,168;--e-teal:45,196,180;--e-blue:96,165,250;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  .sf{font-family:var(--serif);}
  .eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--acc);font-weight:500;}

  /* ---------------- controls ---------------- */
  .bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:600;display:flex;gap:14px;
       align-items:center;background:rgba(252,248,241,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);
       backdrop-filter:blur(20px) saturate(180%);border:.5px solid var(--line);border-radius:999px;
       padding:7px 9px;box-shadow:0 18px 44px -20px rgba(60,50,38,.5);}
  .grp{display:flex;gap:5px;align-items:center;}
  .grp b{font-family:var(--serif);font-weight:400;font-size:12.5px;margin:0 4px 0 8px;color:var(--ink);}
  .bar button{font-size:11.5px;border:.5px solid var(--line);background:#fff;color:var(--ink);
              border-radius:999px;padding:6px 13px;cursor:pointer;transition:.2s var(--ease);white-space:nowrap;}
  .bar button.on{background:var(--acc);color:#fff;border-color:var(--acc);}
  .sep{width:.5px;height:22px;background:var(--line);}

  /* caption card */
  .cap{position:fixed;left:22px;bottom:22px;z-index:600;max-width:340px;
       background:rgba(252,248,241,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
       border:.5px solid var(--line);border-radius:18px;padding:18px 20px;
       box-shadow:0 20px 50px -22px rgba(60,50,38,.45);}
  .cap .t{font-family:var(--serif);font-size:19px;line-height:1.15;margin:0 0 3px;}
  .cap .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:8px;}
  .cap p{margin:0;font-size:13px;line-height:1.5;color:var(--mut);}
  .cap .ix{margin-top:10px;padding-top:10px;border-top:.5px solid var(--line);font-size:12px;color:var(--ink);}
  .cap .ix b{color:var(--acc);font-weight:600;}

  /* ---------------- hero (mobile case study) ---------------- */
  .hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;
        padding:104px 56px 90px;background:var(--paper);}
  .csGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.98fr);gap:52px;align-items:center;width:100%;max-width:1180px;margin:0 auto;}
  .csCopy{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .kicker{display:flex;align-items:center;gap:13px;justify-content:center;}
  .kicker em{display:block;width:42px;height:1.5px;background:var(--acc);}
  .hero h1{font-family:var(--serif);font-weight:400;letter-spacing:-.022em;font-size:clamp(44px,6vw,84px);line-height:.96;margin:14px 0 0;}
  .tagWrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;margin-top:22px;min-height:120px;}
  .backdrop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;}
  .backdrop span{font-family:var(--script);line-height:1;white-space:nowrap;color:var(--word-light);font-size:clamp(84px,11vw,170px);}
  .tag{position:relative;z-index:1;margin:0;font-family:var(--serif);font-style:italic;color:var(--acc);font-size:clamp(23px,2.9vw,38px);max-width:20ch;line-height:1.15;}
  .blurb{color:var(--mut);font-size:clamp(14px,1.15vw,17px);max-width:44ch;margin:16px 0 0;}
  .chip{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:11px 22px;border:.5px solid rgba(180,86,47,.34);
        border-radius:999px;background:rgba(251,246,238,.7);font-size:14px;}
  .chip b{color:var(--acc);font-weight:600;}
  .facts{display:grid;grid-template-columns:1fr 1fr;margin-top:28px;width:100%;max-width:440px;border-top:.5px solid var(--line);}
  .facts .f{padding:12px 16px;text-align:center;border-bottom:.5px solid var(--line);}
  .facts .f:nth-child(even){border-left:.5px solid var(--line);}
  .facts .k{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:3px;}
  .facts .v{font-size:12.5px;font-weight:500;}

  /* ---------------- the two phones + aura stage ---------------- */
  .stage{position:relative;height:clamp(440px,52vw,600px);display:flex;align-items:center;justify-content:center;isolation:isolate;}
  .aura{position:absolute;inset:-14% -8%;z-index:0;pointer-events:none;}
  .aura b{position:absolute;display:block;border-radius:50%;top:50%;left:50%;}
  .ph{position:absolute;border-radius:34px;background:#0f0d0b;padding:7px;
      box-shadow:0 40px 80px -34px rgba(28,24,21,.55);transition:box-shadow .5s var(--ease);}
  .ph .scr{border-radius:27px;overflow:hidden;height:100%;padding:15px 12px;background:#141210;}
  .ph.back{width:clamp(176px,20vw,232px);height:clamp(360px,42vw,486px);transform:rotate(-9deg) translate(-56%,4%);z-index:1;}
  .ph.front{width:clamp(196px,22vw,258px);height:clamp(392px,45vw,532px);transform:rotate(4deg) translate(15%,-2%);z-index:2;}
  .row{background:rgba(255,255,255,.08);border-radius:9px;margin-bottom:8px;}
  .lbl{height:7px;width:52%;background:rgba(255,255,255,.26);border-radius:4px;margin-bottom:11px;}
  .acc{border-radius:9px;}
  /* per-study screen accent */
  [data-cs="boat"] .acc{background:rgba(var(--b-red),.9);}
  [data-cs="boat"] .ring{aspect-ratio:1;border-radius:50%;border:9px solid rgba(var(--b-red),.85);border-right-color:rgba(var(--b-red),.2);border-bottom-color:rgba(var(--b-red),.2);margin:2px auto 10px;width:64%;transform:rotate(-30deg);}
  [data-cs="elevate"] .acc{background:rgba(var(--e-indigo),.9);}
  [data-cs="elevate"] .dot{width:8px;height:8px;border-radius:50%;background:rgba(var(--e-teal),1);display:inline-block;margin-right:8px;box-shadow:0 0 8px rgba(var(--e-teal),.9);}
  [data-cs="elevate"] .stat{display:flex;align-items:center;height:34px;padding:0 11px;background:rgba(255,255,255,.06);border-radius:9px;margin-bottom:8px;}
  [data-cs="elevate"] .stat i{flex:1;height:6px;background:rgba(255,255,255,.22);border-radius:3px;font-style:normal;}

  /* ================= GLOW DIRECTIONS ================= */
  /* Baseline: the current hover-follow terracotta radial (for reference) */
  .aura.cur{--gsz:760px;opacity:0;transition:opacity .5s ease;}
  .aura.cur b.g{width:var(--gsz);height:var(--gsz);margin:calc(var(--gsz)/-2) 0 0 calc(var(--gsz)/-2);
    background:radial-gradient(circle closest-side,rgba(196,110,66,.2),transparent 70%);will-change:transform;}
  .stage:hover .aura.cur{opacity:1;}
  @media (hover:none){.aura.cur{display:none;}}

  /* ---- boAt 1 · VITAL PULSE (health heartbeat) ---- */
  .aura.b-pulse b{filter:blur(16px);}
  .aura.b-pulse .p1{width:720px;height:720px;margin:-360px 0 0 -330px;
    background:radial-gradient(closest-side,rgba(var(--b-red),.34) 0%,rgba(var(--b-red),.34) 22%,transparent 74%);animation:beat 2.6s var(--ease) infinite;}
  .aura.b-pulse .p2{width:400px;height:400px;margin:-250px 0 0 -170px;
    background:radial-gradient(closest-side,rgba(var(--b-heart),.5) 0%,rgba(var(--b-heart),.5) 20%,transparent 72%);animation:beat 2.6s var(--ease) .06s infinite;}
  .aura.b-pulse .p3{width:320px;height:320px;margin:10px 0 0 -360px;
    background:radial-gradient(closest-side,rgba(var(--b-cyan),.24),transparent 70%);}
  @keyframes beat{0%,100%{transform:scale(1);opacity:.82}18%{transform:scale(1.05);opacity:1}30%{transform:scale(1.0);opacity:.9}44%{transform:scale(1.07);opacity:1}60%{transform:scale(1);opacity:.82}}

  /* ---- boAt 2 · SPECTRUM AURORA ---- */
  .aura.b-aurora b{filter:blur(40px);}
  .aura.b-aurora .a1{width:440px;height:440px;margin:-270px 0 0 -280px;background:radial-gradient(closest-side,rgba(var(--b-red),.46),transparent 70%);animation:drift1 13s ease-in-out infinite;}
  .aura.b-aurora .a2{width:420px;height:420px;margin:-140px 0 0 -40px;background:radial-gradient(closest-side,rgba(var(--b-violet),.44),transparent 70%);animation:drift2 15s ease-in-out infinite;}
  .aura.b-aurora .a3{width:400px;height:400px;margin:-30px 0 0 -320px;background:radial-gradient(closest-side,rgba(var(--b-cyan),.4),transparent 70%);animation:drift3 17s ease-in-out infinite;}
  .aura.b-aurora .a4{width:360px;height:360px;margin:-250px 0 0 -20px;background:radial-gradient(closest-side,rgba(var(--b-indigo),.36),transparent 70%);animation:drift1 19s ease-in-out infinite reverse;}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-22px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
  @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,26px)}}

  /* ---- boAt 3 · SCREEN SPILL (light emitted from each screen) ---- */
  .aura.b-spill b{filter:blur(12px);}
  .aura.b-spill .s1{width:330px;height:520px;border-radius:70px;margin:-260px 0 0 -330px;transform:rotate(-9deg);
    background:radial-gradient(ellipse 55% 46% at 50% 46%,rgba(var(--b-red),.4) 0%,rgba(var(--b-red),.4) 24%,transparent 74%);}
  .aura.b-spill .s2{width:370px;height:560px;border-radius:70px;margin:-280px 0 0 -50px;transform:rotate(4deg);
    background:radial-gradient(ellipse 55% 46% at 50% 46%,rgba(var(--b-heart),.36) 0%,rgba(var(--b-heart),.36) 22%,transparent 74%);}
  .aura.b-spill .s3{width:240px;height:240px;margin:80px 0 0 -120px;background:radial-gradient(closest-side,rgba(var(--b-violet),.22),transparent 70%);filter:blur(28px);}
  [data-dir="b-spill"] .ph.front{box-shadow:0 34px 90px -26px rgba(var(--b-red),.42),0 40px 80px -40px rgba(28,24,21,.5);}
  [data-dir="b-spill"] .ph.back{box-shadow:0 30px 80px -28px rgba(var(--b-heart),.34),0 40px 80px -44px rgba(28,24,21,.5);}

  /* Coloured glow-shadow on the phone silhouette — the reliable "switched on" cue, per direction. */
  [data-dir="b-pulse"] .ph.front{box-shadow:0 30px 96px -22px rgba(var(--b-red),.5),0 40px 80px -42px rgba(28,24,21,.5);}
  [data-dir="b-pulse"] .ph.back{box-shadow:0 26px 80px -26px rgba(var(--b-heart),.34),0 40px 80px -44px rgba(28,24,21,.5);}
  [data-dir="b-aurora"] .ph.front{box-shadow:0 30px 96px -22px rgba(var(--b-violet),.45),0 40px 80px -42px rgba(28,24,21,.5);}
  [data-dir="b-aurora"] .ph.back{box-shadow:0 26px 84px -26px rgba(var(--b-cyan),.36),0 40px 80px -44px rgba(28,24,21,.5);}
  [data-dir="e-updraft"] .ph.front{box-shadow:0 30px 96px -22px rgba(var(--e-indigo),.52),0 40px 80px -42px rgba(28,24,21,.5);}
  [data-dir="e-updraft"] .ph.back{box-shadow:0 26px 84px -26px rgba(var(--e-teal),.42),0 40px 80px -44px rgba(28,24,21,.5);}
  [data-dir="e-signal"] .ph.front{box-shadow:0 30px 96px -22px rgba(var(--e-teal),.48),0 40px 80px -42px rgba(28,24,21,.5);}
  [data-dir="e-signal"] .ph.back{box-shadow:0 26px 84px -26px rgba(var(--e-steel),.42),0 40px 80px -44px rgba(28,24,21,.5);}
  [data-dir="e-key"] .ph.front{box-shadow:0 30px 96px -22px rgba(var(--e-indigo),.48),0 40px 80px -42px rgba(28,24,21,.5);}
  [data-dir="e-key"] .ph.back{box-shadow:0 26px 84px -26px rgba(var(--e-steel),.36),0 40px 80px -44px rgba(28,24,21,.5);}

  /* ---- Elevate 1 · UPDRAFT (a rising shaft of light — "elevate" / the shaft) ---- */
  .aura.e-updraft{overflow:hidden;}
  .aura.e-updraft b{filter:blur(20px);}
  .aura.e-updraft .u1{width:260px;height:150%;border-radius:130px;top:auto;bottom:-30%;left:50%;margin-left:-130px;
    background:linear-gradient(to top,rgba(var(--e-indigo),.52),rgba(var(--e-blue),.26) 46%,transparent 82%);animation:rise 6.5s ease-in-out infinite;}
  .aura.e-updraft .u2{width:140px;height:130%;border-radius:90px;top:auto;bottom:-20%;left:50%;margin-left:-70px;
    background:linear-gradient(to top,rgba(var(--e-teal),.46),transparent 74%);animation:rise 6.5s ease-in-out .8s infinite;}
  .aura.e-updraft .u3{width:560px;height:340px;margin:130px 0 0 -280px;top:50%;left:50%;
    background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(var(--e-steel),.36),transparent 72%);filter:blur(32px);}
  @keyframes rise{0%,100%{opacity:.7;transform:translateY(14px) scaleY(.98)}50%{opacity:1;transform:translateY(-10px) scaleY(1.02)}}

  /* ---- Elevate 2 · ONLINE SIGNAL (status ping — a unit comes online) ---- */
  .aura.e-signal b{filter:blur(4px);}
  .aura.e-signal .field{width:680px;height:560px;margin:-280px 0 0 -300px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(var(--e-steel),.32),transparent 72%);filter:blur(30px);}
  .aura.e-signal .ping{width:140px;height:140px;margin:-200px 0 0 -20px;border-radius:50%;
    border:2.5px solid rgba(var(--e-teal),.85);animation:ping 3.4s ease-out infinite;}
  .aura.e-signal .ping.d2{animation-delay:1.15s;}
  .aura.e-signal .ping.d3{animation-delay:2.3s;}
  .aura.e-signal .core{width:260px;height:260px;margin:-240px 0 0 -90px;
    background:radial-gradient(closest-side,rgba(var(--e-teal),.46) 0%,rgba(var(--e-teal),.46) 16%,transparent 70%);filter:blur(14px);}
  @keyframes ping{0%{transform:scale(.5);opacity:0}12%{opacity:.9}100%{transform:scale(3.4);opacity:0}}

  /* ---- Elevate 3 · COOL KEY LIGHT (studio product light — calm, controlled) ---- */
  .aura.e-key b{filter:blur(26px);}
  .aura.e-key .k1{width:600px;height:520px;margin:-300px 0 0 -350px;
    background:radial-gradient(ellipse 58% 52% at 42% 40%,rgba(var(--e-indigo),.36) 0%,rgba(var(--e-indigo),.36) 14%,transparent 72%);animation:breathe 9s ease-in-out infinite;}
  .aura.e-key .k2{width:460px;height:400px;margin:40px 0 0 -60px;
    background:radial-gradient(ellipse 55% 55% at 55% 55%,rgba(var(--e-teal),.26),transparent 72%);animation:breathe 9s ease-in-out 1.2s infinite;}
  @keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}

  @media (max-width:1000px){
    .csGrid{grid-template-columns:1fr;gap:30px;}
    .hero{padding:96px 22px 70px;}
    .stage{height:440px;}
    .cap{display:none;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
</style>
</head>
<body data-cs="boat" data-dir="b-pulse">

<div class="bar">
  <div class="grp"><b>Study</b>
    <button data-cs="boat" class="on">boAt</button>
    <button data-cs="elevate">Elevate</button>
  </div>
  <span class="sep"></span>
  <div class="grp" id="dirs"><b>Glow</b></div>
</div>

<div class="cap" id="cap"></div>

<header class="hero">
  <div class="csGrid">
    <div class="csCopy" id="copy"></div>
    <div class="stage" id="stage">
      <div class="aura" id="aura"></div>
      <!-- phones injected -->
    </div>
  </div>
</header>

<script>
const AURA = {
  'cur':      {n:'Current (reference)', for:'both', k:'Baseline', d:'The existing hover-follow terracotta radial. Off on touch, so mobile gets no glow at all. This is what we are replacing.', ix:'Follows the cursor. Nothing on tap devices.'},

  'b-pulse':  {n:'Vital Pulse', for:'boat', k:'boAt · health', d:'A warm brand-red bloom that breathes on a heartbeat cadence, with a cool SpO₂ wink low-left. Reads as a living wearable, not a lamp.', ix:'Double-thump heartbeat, always on. Steadies under reduced-motion.'},
  'b-aurora': {n:'Spectrum Aurora', for:'boat', k:'boAt · brand energy', d:'The full boAt spectrum — red, violet, cyan, indigo — as soft drifting fields that mix behind the pair. Ultra-modern, ambient-display energy.', ix:'Slow independent drift on each colour field.'},
  'b-spill':  {n:'Screen Spill', for:'boat', k:'boAt · emitted light', d:'Light that pours out of each screen, tilted to match the phone and echoed as a coloured shadow. The devices feel switched on.', ix:'Static + a coloured cast on the phones. Calmest of the three.'},

  'e-updraft':{n:'Updraft', for:'elevate', k:'Elevate · the lift', d:'A rising shaft of cool light behind the pair — the elevator shaft, and the word itself. Brightest at the base, dissolving upward.', ix:'A gentle continuous rise. Literalises “elevate”.'},
  'e-signal': {n:'Online Signal', for:'elevate', k:'Elevate · brought online', d:'A steel field with a teal status ping rippling outward — a mechanic bringing a unit online in the field. Technical, restrained.', ix:'Concentric pings on a slow stagger.'},
  'e-key':    {n:'Cool Key Light', for:'elevate', k:'Elevate · studio calm', d:'A single soft cool key light with a teal fill, product-photography style. The safe, quiet, premium option.', ix:'A slow breathe. Nearly still.'},
};
const ORDER = {boat:['cur','b-pulse','b-aurora','b-spill'], elevate:['cur','e-updraft','e-signal','e-key']};

const COPY = {
  boat:{eyebrow:'Case study · Product design', h1:'boAt Crest', word:'crest', tag:'Making the app worthy of the watch.',
    blurb:"A ground-up redesign of boAt's smartwatch companion app, from cluttered and one-size-fits-all into a calm, personal system people actually want to open.",
    chip:'★ <b>4.2</b> App Store rating · up from 2.3',
    facts:[['My role','Sole product designer'],['Scope','Research · UX · UI · System'],['Platform','iOS · Android'],['Timeline','2024']]},
  elevate:{eyebrow:'Case study · Product design', h1:'Elevate ONE View', word:'elevate', tag:'Bringing elevators online, anywhere in the world.',
    blurb:'The mobile interface field mechanics use to commission and maintain Elevate elevators worldwide, turning a heavy workflow into something fast in the field.',
    chip:'', facts:[['My role','UX and UI · design system'],['Scope','Enterprise mobile app'],['Platform','Mobile'],['Timeline','6 months']]},
};

const PHONES = {
  boat:`
    <div class="ph back"><div class="scr">
      <div class="lbl"></div>
      <div class="row" style="height:58px"></div>
      <div class="acc" style="height:36px;margin-bottom:8px"></div>
      <div class="row" style="height:50px"></div>
      <div class="row" style="height:50px"></div>
      <div class="row" style="height:70px"></div>
    </div></div>
    <div class="ph front"><div class="scr">
      <div class="lbl" style="width:38%"></div>
      <div class="ring"></div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <div class="row" style="flex:1;height:56px;margin:0"></div>
        <div class="row" style="flex:1;height:56px;margin:0"></div>
      </div>
      <div class="row" style="height:64px"></div>
      <div class="acc" style="height:42px"></div>
    </div></div>`,
  elevate:`
    <div class="ph back"><div class="scr">
      <div class="lbl"></div>
      <div class="stat"><span class="dot"></span><i></i></div>
      <div class="stat"><span class="dot"></span><i></i></div>
      <div class="stat"><span class="dot"></span><i></i></div>
      <div class="row" style="height:70px"></div>
      <div class="acc" style="height:34px"></div>
    </div></div>
    <div class="ph front"><div class="scr">
      <div class="lbl" style="width:44%"></div>
      <div class="row" style="height:52px"></div>
      <div class="stat"><span class="dot"></span><i></i></div>
      <div class="stat"><span class="dot"></span><i></i></div>
      <div class="row" style="height:96px"></div>
      <div class="acc" style="height:42px"></div>
    </div></div>`,
};

const AURA_HTML = {
  'cur':'<b class="g"></b>',
  'b-pulse':'<b class="p1"></b><b class="p2"></b><b class="p3"></b>',
  'b-aurora':'<b class="a1"></b><b class="a2"></b><b class="a3"></b><b class="a4"></b>',
  'b-spill':'<b class="s1"></b><b class="s2"></b><b class="s3"></b>',
  'e-updraft':'<b class="u3"></b><b class="u1"></b><b class="u2"></b>',
  'e-signal':'<b class="field"></b><b class="core"></b><b class="ping"></b><b class="ping d2"></b><b class="ping d3"></b>',
  'e-key':'<b class="k1"></b><b class="k2"></b>',
};

const body=document.body, stage=document.getElementById('stage'), aura=document.getElementById('aura'),
      copy=document.getElementById('copy'), cap=document.getElementById('cap'), dirs=document.getElementById('dirs');
let cs='boat', dir='b-pulse';

function renderCopy(){
  const c=COPY[cs];
  copy.innerHTML=`
    <div class="kicker eyebrow"><em></em> ${c.eyebrow}</div>
    <h1 class="sf">${c.h1}</h1>
    <div class="tagWrap"><div class="backdrop"><span>${c.word}</span></div><p class="tag">${c.tag}</p></div>
    <p class="blurb">${c.blurb}</p>
    ${c.chip?`<div class="chip">${c.chip}</div>`:''}
    <div class="facts">${c.facts.map(f=>`<div class="f"><div class="k">${f[0]}</div><div class="v">${f[1]}</div></div>`).join('')}</div>`;
}
function renderDirs(){
  dirs.querySelectorAll('button').forEach(b=>b.remove());
  ORDER[cs].forEach(id=>{
    const b=document.createElement('button');
    b.textContent=AURA[id].n.replace(' (reference)','');
    b.dataset.dir=id; if(id===dir)b.classList.add('on');
    b.onclick=()=>{dir=id;apply();};
    dirs.appendChild(b);
  });
}
function apply(){
  body.dataset.cs=cs; body.dataset.dir=dir;
  aura.className='aura '+dir;
  aura.innerHTML=AURA_HTML[dir];
  // phones live after aura inside stage
  stage.querySelectorAll('.ph').forEach(p=>p.remove());
  stage.insertAdjacentHTML('beforeend',PHONES[cs]);
  const a=AURA[dir];
  cap.innerHTML=`<div class="k">${a.k}</div><p class="t">${a.n.replace(' (reference)','')}</p><p>${a.d}</p><div class="ix"><b>Interaction · </b>${a.ix}</div>`;
  dirs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.dir===dir));
  document.querySelectorAll('.bar .grp:first-child button').forEach(b=>b.classList.toggle('on',b.dataset.cs===cs));
}
document.querySelectorAll('.bar .grp:first-child button').forEach(b=>{
  b.onclick=()=>{cs=b.dataset.cs; dir=ORDER[cs][1]; renderCopy(); renderDirs(); apply();};
});

// baseline cursor-follow, only active when dir==='cur'
let x=0,y=0,q=false;
stage.addEventListener('pointermove',e=>{
  if(dir!=='cur')return; const g=aura.querySelector('.g'); if(!g)return;
  const r=stage.getBoundingClientRect(); x=e.clientX-r.left; y=e.clientY-r.top;
  if(!q){q=true;requestAnimationFrame(()=>{g.style.transform=`translate3d(${x}px,${y}px,0)`;q=false;});}
},{passive:true});

renderCopy(); renderDirs(); apply();
</script>
</body>
</html>
