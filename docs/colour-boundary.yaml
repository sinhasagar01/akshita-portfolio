# THE COLOUR BOUNDARY — every colour on this site that a theme cannot move, and why.
#
# ⚠ THIS IS A RECORD THAT HAPPENS TO BE MACHINE-READABLE, NOT A TEST FIXTURE. `ralph/tests/
# colour-census.mjs` reads it, but the gate is not its audience. Every row below is a DESIGN
# DECISION, and four PRs promised "the boundary list" as something a person could consult before
# one existed. This is that.
#
# ⚠ AND EVERY ROW CARRIES ITS REASON AS PROSE. "signature" tells the next reader nothing. "The
# vessel depicts nothing — it is a container for the site's own prose" is what makes the ruling
# survive somebody disagreeing with it. The categories are shorthand; the sentences are the durable
# part, and they are what to read if you are here to overturn something.
#
# ---- HOW THIS CAME TO EXIST -------------------------------------------------------------------
#
# The census's exclusions used to live as regexes inside the suite. That made the SUBJECT
# tool-defined rather than declared — E1's shape, which this whole arc was spent repairing. It
# produced two wrong numbers: a selector filter hid seven vessel parts, then the same filter,
# copied into a scoping script, reported "roughly four items left" when there were thirty-nine.
#
#   A FILTER ENCODED TWICE IS A FILTER THAT DISAGREES WITH ITSELF, AND NEITHER COPY CAN BE REVIEWED.
#
# Three things this buys. A missing category becomes a ROW THAT DID NOT MATCH rather than a silent
# omission. A wrong category becomes REVIEWABLE, which a regex is not. And the emptiness assertion
# that follows can claim completeness over a subject that was DECLARED rather than one the
# instrument drew around itself.

# ---- THE TWO KINDS, WHICH DIFFER IN KIND RATHER THAN DEGREE -----------------------------------
#
# ⚠ THE FIRST FOUR COULD IN PRINCIPLE BE COMPUTED. THE LAST THREE NEVER CAN. Marking which is which
# means a future instrument knows what it may INFER and what it must be TOLD — and stops a later
# author trying to derive "is this artwork" from the value.
kinds:
  mechanical:
    what: >
      Decidable by inspection, no judgement required. ⚠ THIS DEFINITION WIDENED IN #341 and the
      widening is stated rather than done quietly: it read "a property of the VALUE", and
      `ships-publicly-no-public-consumer` is a property of WHERE A VALUE IS CONSUMED. Still
      mechanical — a machine resolves it and nobody has to rule on it — but the boundary of the
      word moved, and a kind whose definition drifts silently is how a subject stops being declared.
    categories: [derived, mask, compiler-default, not-a-colour, ships-publicly-no-public-consumer]
  judgement:
    what: >
      A property of WHAT IT DRAWS. No amount of parsing decides these.

      ⚠ EACH CATEGORY DECLARES THE TEST ITS PROSE MUST ANSWER, and every entry carries its answer in
      a `test:` field. `category:` was A LABEL AND NOT A CLAIM until #365 — nothing read it. `Z4`
      asserted the vocabulary and `Z5` that an entry declares a known kind, but NO ASSERTION EVER
      COMPARED A KIND TO ITS REASON, so five of five `signature` entries sat in a category none of
      their reasons argued for. The second field here to be decoration, after `count:`.
      A FIELD NOTHING READS DRIFTS SILENTLY AND LOOKS AUTHORITATIVE WHILE IT DOES.

      The gate is `Z8`: a category with no declared test FAILS, and an entry with no answer FAILS.
      Deliberately NOT a list of accepted phrases — that would be a regex in a data file, which is
      the shape #339 removed.
    categories:
      artwork-by-file:
        test: >
          WHAT DOES THE FILE DEPICT? A `fill=` in an illustration and a `fill=` in a UI icon are
          different questions, and the test is the file's purpose rather than the syntax it uses.
      depiction:
        test: >
          IS IT DRAWN IN THE SITE'S VOICE, OR IN THE DEPICTED THING'S OWN COLOURS? A browser mock
          uses browser-chrome grey; a blog diagram uses the site's ink and hairlines, and themes.

          ⚠ THE FINER FORM OF `artwork-by-file`, AND IT EXISTS BECAUSE THAT ONE ASKS ABOUT THE FILE.
          A console is not an illustration file, so a small illustrative region inside it has no
          category under a per-file test — and "what does it draw" gives the WRONG answer here,
          because the blog diagrams DEPICT four squads' form UIs and were deliberately built to
          theme. Two things depicting, opposite rulings, both correct.

          It supersedes `artwork-by-file`'s phrasing without moving any of its outcomes, and it
          explains a split WITHIN one file, which a per-file test cannot. An entry here must say
          what the region depicts and why the site's palette would misrepresent it.
      forced-literal:
        test: >
          WHAT MAKES THE TOKEN FORM IMPOSSIBLE HERE? Name the mechanism, not the inconvenience.
      invariant:
        test: >
          ⚠ DOES IT HOLD WHEN THE GROUND MOVES, AND WHY MUST IT NOT MOVE? State the ground-change
          test explicitly. THIS KIND INHERITS `signature`'s FAILURE MODE — every entry that meant
          "this IS the design" was ruled on a one-theme site, which is to say the test was never
          run, and all three failed it when a second palette arrived.
      near-miss-kept:
        test: >
          WHAT IS THE MEASURED DISTANCE, OVER WHAT GROUND, AND WHY IS IT PAST THE SNAP THRESHOLD?
          The claim is a MEASUREMENT, so the prose carries its number or it is not this kind.
      adjacent:
        test: >
          WHICH SURFACE DOES IT REACH, AND WHY IS THAT SURFACE NOT THE PAGE?

          ⚠ `raster-baked` IS A REAL SHAPE AND IS DELIBERATELY NOT A CATEGORY. A colour in a webp
          and a colour in an OG card are both unreachable by static analysis, and they are not the
          same claim: adjacent is about WHERE the colour lands, raster-baked about WHAT FORM it is
          in. The eight Fosfor illustrations settled it — a raster-baked colour is FIXABLE by
          rebuilding the asset as inline SVG, so its correct treatment is REPAIR RATHER THAN
          EXEMPTION. A category for it would have zero members and would invite the next one to be
          excused instead of rebuilt.

# ---- ⚠ `signature` IS DELETED FROM THIS VOCABULARY, AND THE AUDIT IS WHY -----------------------
#
# It meant "a thing that IS the design rather than a skin on it". THREE ENTRIES GENUINELY MEANT IT —
# the custom cursor, the page loader ramp and the case-study hero auras — and ALL THREE FAILED THE
# GROUND-CHANGE TEST when a second palette arrived, because each was decoration that happened to be
# warm. All three were deleted rather than recategorised.
#
# The five entries still wearing the word each meant something else, which the #365 audit found by
# reading their prose against their label. ZERO CORRECT MEMBERS, AND A HUNDRED PERCENT FAILURE RATE
# AMONG THE TRUE ONES.
#
# ⚠ AND THE ONE THING THAT PASSES THE SIGNATURE TEST IS NOT IN THIS FILE AT ALL. The mark is
# COMPUTED — `theme-contrast` measures `--color-mark` and `--color-mark-on-dark` against their
# grounds — because invariance is a claim about whether a THEME MAY MOVE a colour, and this file is
# a list of colours nothing MEASURES. Those are different questions and one word was doing both.
# `invariant` above carries the first half; the contrast map carries the second.

# ---- RULES THAT GOVERN HOW A COLOUR IS JUDGED --------------------------------------------------
rules:
  - id: composite-not-declaration
    since: "#332"
    rule: >
      Judge a near-miss on the COMPOSITE distance over its real ground, not on the declaration.
      The composite tracks the alpha exactly — .11 to .14 gives about 1, .50 to .55 gives 4 to 5,
      .74 gives 5 to 7, and opacity 1 gives the declaration back.
    corrected_by: base-colour-highest-alpha

  - id: base-colour-highest-alpha
    since: "#338"
    rule: >
      A base colour is ruled ONCE, at its HIGHEST alpha — not once per occurrence.
    why: >
      ⚠ This is a CORRECTION to composite-not-declaration, not an addition beside it. That rule as
      approved carries this failure mode and did not say so. The vessel's oklch(0.94 0.025 40) is 5
      from cream-200 at .45 and 9 at .8, so judging per occurrence would snap the low-alpha use and
      leave the high one — PRODUCING TWO COLOURS WHERE THE DESIGN HAS ONE. That is the smoke-ramp
      and hero-word defect arriving through the composite rule rather than through a ramp.

  - id: artwork-by-file
    since: "#333"
    rule: >
      Artwork is excluded by what the FILE IS FOR, not by where the colour sits. A fill in an
      illustration and a fill in a UI icon are different questions.

  - id: two-sources-is-not-the-defect
    since: "#334"
    rule: >
      A component drawing from two colour sources is not itself wrong. SectionHeading's branches
      drew the same thing and disagreed, which was. The process diagram's outline is the drawing
      gesture and its fills depict a product screen — two sources, correctly.

# ---- THE ENTRIES -------------------------------------------------------------------------------
entries:
  # ---------------------------------------------------------------- mechanical
  - id: derived
    kind: mechanical
    entry_kind: category
    match: { form: "oklch(from var(--…) …) and color-mix() containing no literal" }
    reason: >
      ⚠ Relative colour syntax over a token is the MOST themed form a colour can take — strictly
      more themed than a plain var(). The census counted 14 of these as authored literals before
      #336, because the instrument built to replace a name-blind census was derivation-blind.
      Stripped by FORM, never by substring: a gradient with one token stop and one literal stop
      must still report the literal.

  - id: mask
    kind: mechanical
    entry_kind: category
    match: { property: "mask-image, -webkit-mask-image, mask" }
    reason: >
      ⚠ NOT A COLOUR AT ALL. #000 in a mask is an ALPHA CHANNEL — black means opaque. There is
      nothing to theme, which makes this different from every entry that is excluded because it
      must not change.

  - id: compiler-default
    kind: mechanical
    entry_kind: category
    match: { property: "--tw-*", also: "@supports color-mix fallbacks" }
    reason: >
      Tailwind emits a hex fallback beside every color-mix utility and initial values for its own
      custom properties. A browser that cannot do color-mix cannot do the theme either, so the
      fallback is not a themeable surface BY CONSTRUCTION rather than by exclusion.

  # ---------------------------------------------------------------- judgement
  - id: project-card-artwork
    kind: judgement
    category: artwork-by-file
    where: components/sections/ProjectCardSvgs.tsx
    count: 118
    files: [components/sections/ProjectCardSvgs.tsx]
    reason: >
      An illustration file. 112 of the site's 115 SVG colour attributes live here and are excluded
      whole, by what the file is for rather than by the syntax the colour is written in.
    test: >
      The file is an ILLUSTRATION SET — 112 of the site's 115 SVG colour attributes live in it,
      drawing product cards rather than interface. Its purpose is depiction, so every colour in it is
      excluded whole rather than attribute by attribute.

      ⚠ THE COUNT WENT 77 -> 118 WHEN THE CARDS WERE REDRAWN, AND J5 IS WHAT SAID SO. The four
      uploads the cards used to render were a device on a saturated gradient with bokeh, one recipe
      four times; the replacements draw each product in ITS OWN COLOURS on the site's paper. More
      depiction means more literals, and every one of them is a product's rather than the site's —
      which is the same reason the file was excluded in the first place, arriving at a larger number.

      ⚠ AND THE PROSE MOVED WITH THE FIELD ON PURPOSE. This row said "77 of the site's 82" in two
      places while `count:` said 77. Updating only the field would have left the sentence a reader
      trusts stating a figure nothing checks — the exact drift `count:` was made load-bearing to
      stop.

  - id: process-diagram-fills
    kind: judgement
    category: artwork-by-file
    where: components/sections/ProcessSection.tsx
    count: 3
    files: [components/sections/ProcessSection.tsx]
    reason: >
      ⚠ The accent OUTLINE is the drawing gesture — this site's hand, sketching — so it follows the
      palette. These three FILLS depict a product screen being designed: a wireframe of somebody
      else's interface, not a surface of this one. Theming them would make the depicted product
      change colour with the portfolio. Measured at 17, 54 and 73 from cream-300 before deciding.
    test: >
      The three fills DEPICT a product screen being designed, a wireframe of somebody else's
      interface. The accent OUTLINE around them is this site's hand sketching and it themes; the fills
      are the thing being drawn and they do not.

  - id: studio-chrome-and-property-defaults
    kind: mechanical
    category: ships-publicly-no-public-consumer
    where: app/globals.css (.studio-chrome and its descendants), Tailwind @property blocks
    selectors: [".studio-chrome", ".studio-chrome #studio-sidebar",
                ".studio-chrome #studio-sidebar::-webkit-scrollbar-thumb",
                ".studio-chrome #studio-sidebar::-webkit-scrollbar-thumb:hover",
                "property --tw-ring-offset-color"]
    reason: >
      The editor's own chrome, shipped in the one stylesheet Tailwind compiles, plus a Tailwind
      `@property` initial value whose "property" reads `property --tw-ring-offset-color` and so
      escapes the `--tw-` prefix test one syntax further out. Studio surfaces are outside the theme
      by construction (#323), and a compiler default is not authored colour.

  - id: hsl-oklch-comparison
    kind: judgement
    category: depiction
    where: "components/palettes/OklchPrimer.tsx (section 04, the two four-cell comparison boards)"
    files: [components/palettes/OklchPrimer.tsx]
    count: 16
    reason: >
      ⚠ THE WHOLE DEMONSTRATION IS THAT THESE SPECIFIC VALUES BEHAVE THE WAY THEY DO. Four HSL
      colours all declared at fifty percent lightness, which are wildly uneven in perceived
      brightness, beside four OKLCH colours all declared at seventy-two percent, which are even. A
      palette recolouring either row would destroy the comparison rather than skin it — the point
      is not that these are yellow and blue, it is that the NUMBER LIES in one system and holds in
      the other, and only these values prove it.

      The eight foregrounds are fixed for the same reason and not a lesser one. Each is chosen to be
      legible on the specific cell beneath it, and those cells cannot move, so a themed foreground
      would be a text colour tracking a palette across a ground that does not.

      ⚠ THIS IS `oklch-axis-ramps` RETURNING WITH ITS SUBJECT, AND THE ROW WAS DELETED IN #517 WHEN
      THAT SUBJECT LEFT `/palettes`. The old ramps illustrated the three axes on the console; they
      were removed with the old layout and the row went with them by its own end condition. The
      primer is where the axes live now, so the reason is re-stated here rather than lost — a
      boundary entry deleted while its subject is rebuilt elsewhere is coverage lost silently, which
      is the one failure this file cannot detect about itself.
    test: >
      IS IT DRAWN IN THE SITE'S VOICE OR IN THE DEPICTED THING'S OWN COLOURS? Entirely the latter.
      These depict two COLOUR SYSTEMS, which exist independently of this site, in the same way a
      browser mock uses browser-chrome grey. The ground-change test does not merely permit them to
      stay fixed — it requires it. A hue comparison that changed hue with the palette would be an
      argument about hue that lies about hue.

      ⚠ AND THE THREE MENTAL-MODEL BANDS AND THE LIGHTNESS LADDER ARE THE SAME DECISION AND ARE NOT
      IN THIS COUNT, WHICH IS STATED RATHER THAN LEFT TO BE INFERRED. They carry the identical
      reason — they depict the space, and a themed hue band would lie about hue — but they are
      COMPUTED from the lab's slider values through a helper rather than written as literals, so the
      census never sees them at all. They are outside its population rather than excluded from it.
      A row claiming to exclude them would be claiming a coverage that does not exist.

      CLEARS IF THE COMPARISON STOPS COMPARING SYSTEMS. If section 04 is ever rebuilt to show this
      site's own palettes on the two scales, the cells become interface and take tokens.

  - id: primer-generated-and-rendered-oklch
    kind: mechanical
    category: not-a-colour
    where: "components/palettes/OklchPrimer.tsx (the `css()` helper, the hero formula, and the code blocks in section 06)"
    files: [components/palettes/OklchPrimer.tsx]
    count: 4
    reason: >
      ⚠ ONE CONSTRUCTOR AND THREE TEXT NODES, NONE OF WHICH IS AN AUTHORED COLOUR.

      The constructor is `css(l, c, h)`, a template literal that BUILDS an OKLCH string from three
      numbers. It is the opposite of a frozen colour — every themed value on this page passes
      through it, and the values it emits are whatever the sliders hold. The census matches its
      template because a template with no closing-paren inside it is lexically a colour.

      The three text nodes are the hero formula and the two section 06 code blocks, which SHOW the
      reader a declaration. The
      word is rendered as prose beside styled spans carrying the numbers; nothing is painted with
      it. Same shape as `hero-formula-text` on `/palettes`, and matched the same way — the pattern
      starts at the literal and runs across newlines and JSX to whatever close comes first, which is
      the unbalanced-matcher family arriving through the census's own pattern for the second time.

      ⚠ AND `count` IS WHAT MAKES A FILE-LEVEL ROW SAFE HERE. This file legitimately holds sixteen
      depicted colours claimed by the row above, so a join that merely named the file would excuse
      anything added later. `J5` requires the declared counts to SUM to what the census finds, so a
      real raw colour arriving in this component fails rather than being absorbed.

  - id: hero-formula-text
    kind: mechanical
    category: not-a-colour
    where: "components/palettes/PaletteConsole.tsx (the hero formula in section 01)"
    files: [components/palettes/PaletteConsole.tsx]
    count: 1
    reason: >
      ⚠ TEXT CONTENT SHAPED LIKE A COLOUR, NOT A PAINT INSTRUCTION. The hero shows the live palette's
      accent written out as an OKLCH function, because the page's whole argument is that the third
      number is the theme. The word `oklch(` is a TEXT NODE and the three components come from
      `active.tokens["accent-500"]` at render — nothing here sets a colour on anything.

      ⚠ AND THE CENSUS MATCHES IT BY SPANNING JSX, WHICH IS THE UNBALANCED-MATCHER FAMILY AGAIN.
      `colourPattern` reads `oklch\([^)]*\)`, so it starts at the literal `oklch(` in the markup and
      runs across newlines and elements to whatever `)` comes first — a match roughly ninety
      characters long containing three JSX expressions. Sixth member of that family in this
      repository, and the first where the pattern is the CENSUS'S rather than a probe's.

      ⚠ THE ROW WAS PREFERRED OVER HIDING THE STRING, AND THAT IS THE ARGUMENT. Splitting the
      literal so no matcher could span it would make the census green while changing nothing about
      what ships, which is the shape that turns an exclusion into a leak. The page really does
      display an OKLCH string; the honest claim is that it is not a colour anything paints.

      ⚠ AND THE OVER-ATTRIBUTION IS BOUNDED BY `count`, WHICH IS WHY THIS IS SAFE AT FILE LEVEL.
      A file-level join over-attributes totally — that defect cost nineteen wrongly credited sites
      once already. `J5` requires the declared count to equal what the census finds in the file, so
      a SECOND colour arriving in this component fails rather than being silently excused by this
      row. The count is the guard, not the label.

  - id: feature-query-operand
    kind: mechanical
    category: not-a-colour
    # ⚠ QUOTED, because the value carries a CSS declaration and `key: value` inside a plain YAML
    # scalar is a mapping. Every other `where:` in this file happens to avoid one.
    where: "lib/palettes/formats.ts (the `@supports not (color: …)` condition in `fallbackBlock`)"
    files: [lib/palettes/formats.ts]
    count: 1
    reason: >
      ⚠ A FEATURE QUERY OPERAND, NOT A COLOUR ANYTHING PAINTS. The copy block wraps its generated
      sRGB fallback in `@supports not (color: …)`, and the operand exists so a browser can be ASKED
      whether it parses oklch at all. It is never applied to an element, has no ground, and no
      theme could move it because moving it would change the question rather than the answer.

      Same kind as `mask`'s black, which is an alpha channel wearing a colour's spelling. Both are
      excluded because the syntax is a colour and the MEANING is not.

      ⚠ AND IT IS THE FIRST MEMBER `not-a-colour` HAS EVER HAD. The category sat in the vocabulary
      with no entry from the day it was declared, which is the shape this file deletes rather than
      ships — a row matching nothing has outlived its subject, and a CATEGORY matching nothing has
      never had one. It is kept rather than deleted only because it now has this.

      ⚠ AND THE ALTERNATIVE WAS THE TRAP. Writing the condition so the literal is not contiguous in
      source would have made the census green while changing nothing about what ships. That is
      "describe it, never transcribe it" applied where it does not belong: the rule exists for
      COMMENTS, where the prose is the whole artefact, and this is executable output. Hiding a real
      literal from an instrument to avoid a row is how an exclusion becomes a leak.

  - id: ground-ceiling-black
    kind: judgement
    category: forced-literal
    where: app/globals.css (:root[data-ground="dark"], --hero-tab-drop, --vessel-drop, --capsule-drop, --hero-piece-drop)
    count: 4
    selectors: [":root[data-ground=dark]"]
    reason: >
      True black at 12 percent, the hero tab pill's drop tint on a dark ground. Not a rung and not a
      role on purpose. A drop shadow must be DARKER than its backdrop, and every pigment in the
      vocabulary is lighter than a near-black page or inverts on it. etch inverts by design, which is
      right for a hairline and wrong for a shadow, and rule holds a mid tone that would glow. The
      nav's dark drops reached the same value by the same ceiling argument and are excused as
      compiler fallbacks only because color-mix sits beside them in the same token. This one stands
      alone, so it is claimed here.
    test: >
      The ground affords 1.61 of darkening against cream's 27.51, measured on nocturne. Any themed
      pigment either glows or clips to black anyway, so the literal IS the derived answer. Three
      members now, one ceiling argument, each at its own consumer's cream alpha: the hero tab's
      0.12, the vessel's 0.30 and the capsule's 0.34 — the vessel pair measured at cream -16.03 to
      -17.32 against nocturne's +1.52 to +1.64 wrong-sign glow before the fix. If a dark shadow
      pigment ever enters the vocabulary, this row's subject moves to it and the row ends.

      ⚠ FOURTH MEMBER, `--hero-piece-drop`, ARRIVING BY THE SAME ROUTE AND WITHOUT A NEW ARGUMENT.
      The ash hero's two interface cards and its cursor carry a drop; the light side is `etch` at
      28 percent and etch INVERTS on a dark ground, which is right for a hairline and wrong for a
      shadow. The count moving 3 to 4 is the field doing its job — a fourth consumer of one ceiling
      argument rather than a fourth argument. It also collapsed the contract's two values, 0.28 for
      the cards and 0.30 for the cursor, into one: the 0.02 between them was not a decision.

  - id: about-photo-tint
    kind: judgement
    category: artwork-by-file
    where: app/globals.css (.ab-tint)
    count: 1
    selectors: [".ab-tint"]
    reason: >
      Measured before it was decided: mix-blend-mode soft-light at opacity .5 over a PHOTOGRAPH. A
      tonal wash rather than a scrim, compositing over artwork rather than the theme's ground, and
      it reads as photographic warmth. A cool theme keeps a warm-cast photo, deliberately.
    test: >
      It composites over a PHOTOGRAPH rather than over the theme's ground — mix-blend-mode soft-light
      at opacity .5 — so what it draws is a tonal wash on artwork, not a scrim on the site.
      Recategorised in #365, where the audit found its prose had argued artwork from the day it was
      written while its label said signature.

  - id: page-loader-fallback-ramp
    kind: judgement
    category: forced-literal
    where: components/motion/PageLoader.tsx (FALLBACK_SHADES)
    count: 8
    files: [components/motion/PageLoader.tsx]
    reason: >
      ⚠ THIS ROW REPLACES A SIGNATURE RULING THAT WAS WRONG, AND IT IS A NARROWER CLAIM THAN THE ONE
      IT REPLACES. The old entry excluded the loader's whole eight-colour ramp because it was "the
      brand arriving, not the site's surface — the same argument as the cursor, one moment earlier".
      That argument was made when one palette had ever shipped, so the test it claims to pass was
      never run. A full-screen terracotta curtain is the FIRST thing a harbour visitor sees.

      The ramp now derives from `--color-accent-500` and follows the theme, so it is no longer
      excluded at all. What remains is the FALLBACK the derivation fails closed to.

      ⚠ AND A FALLBACK CANNOT REFERENCE THE TOKEN WHOSE ABSENCE TRIGGERS IT. That is what makes this
      forced rather than a judgement about how the loader should look. If the accent cannot be read
      as OKLCH the eight literals paint, which is the pre-theme ramp preserved verbatim — the right
      thing to draw when the theme is exactly what could not be determined.

      It is unreachable on every engine that resolves the token, which is every engine the rest of
      the site already requires. Kept because a first-paint brand moment is the wrong place to
      discover a parse failure.
    test: >
      A fallback cannot reference the token whose absence triggers it. The derivation reads
      --color-accent-500; if that cannot be parsed as OKLCH these eight literals paint, which is the
      pre-theme ramp preserved verbatim. The mechanism is the impossibility, not the inconvenience.

  - id: device-mock-chrome
    kind: judgement
    category: artwork-by-file
    where: components/case-study/blocks/deviceScroller.ts
    count: 5
    files: [components/case-study/blocks/deviceScroller.ts]
    reason: >
      Phone and browser chrome around a product screenshot. It depicts a device, not this site.
    test: >
      Phone and browser chrome around a product screenshot. The file DEPICTS A DEVICE rather than this
