      the wrong-noun error this arc has made four times.
      ⚠ THE HERO TAB'S HALF MOVED FILES AND DID NOT MOVE VALUE. It was an inline `boxShadow` in
      HeroSection and is now `--hero-tab-shadow` in globals.css, byte-identical, lifted so that a
