# THE COLOUR BOUNDARY — every colour on this site that a theme cannot move, and why.
#
# ⚠ THIS IS A RECORD THAT HAPPENS TO BE MACHINE-READABLE, NOT A TEST FIXTURE. `ralph/tests/
# colour-census.mjs` reads it, but the gate is not its audience. Every row below is a DESIGN
# DECISION, and four PRs promised "the boundary list" as something a person could consult before
# one existed. This is that.
#
# ⚠ AND EVERY ROW CARRIES ITS REASON AS PROSE. "signature" tells the next reader nothing. "The
# vessel depicts nothing — it is a container for the site's own prose" is what makes the ruling
# survive somebody disagreeing with it. The categories are shorthand; the sentences are the durable
# part, and they are what to read if you are here to overturn something.
#
# ---- HOW THIS CAME TO EXIST -------------------------------------------------------------------
#
# The census's exclusions used to live as regexes inside the suite. That made the SUBJECT
# tool-defined rather than declared — E1's shape, which this whole arc was spent repairing. It
# produced two wrong numbers: a selector filter hid seven vessel parts, then the same filter,
# copied into a scoping script, reported "roughly four items left" when there were thirty-nine.
#
#   A FILTER ENCODED TWICE IS A FILTER THAT DISAGREES WITH ITSELF, AND NEITHER COPY CAN BE REVIEWED.
#
# Three things this buys. A missing category becomes a ROW THAT DID NOT MATCH rather than a silent
# omission. A wrong category becomes REVIEWABLE, which a regex is not. And the emptiness assertion
# that follows can claim completeness over a subject that was DECLARED rather than one the
# instrument drew around itself.

# ---- THE TWO KINDS, WHICH DIFFER IN KIND RATHER THAN DEGREE -----------------------------------
#
# ⚠ THE FIRST FOUR COULD IN PRINCIPLE BE COMPUTED. THE LAST THREE NEVER CAN. Marking which is which
# means a future instrument knows what it may INFER and what it must be TOLD — and stops a later
# author trying to derive "is this artwork" from the value.
kinds:
  mechanical:
    what: >
      Decidable by inspection, no judgement required. ⚠ THIS DEFINITION WIDENED IN #341 and the
      widening is stated rather than done quietly: it read "a property of the VALUE", and
      `ships-publicly-no-public-consumer` is a property of WHERE A VALUE IS CONSUMED. Still
      mechanical — a machine resolves it and nobody has to rule on it — but the boundary of the
      word moved, and a kind whose definition drifts silently is how a subject stops being declared.
    categories: [derived, mask, compiler-default, not-a-colour, ships-publicly-no-public-consumer]
  judgement:
    what: >
      A property of WHAT IT DRAWS. No amount of parsing decides these.

      ⚠ EACH CATEGORY DECLARES THE TEST ITS PROSE MUST ANSWER, and every entry carries its answer in
      a `test:` field. `category:` was A LABEL AND NOT A CLAIM until #365 — nothing read it. `Z4`
      asserted the vocabulary and `Z5` that an entry declares a known kind, but NO ASSERTION EVER
      COMPARED A KIND TO ITS REASON, so five of five `signature` entries sat in a category none of
      their reasons argued for. The second field here to be decoration, after `count:`.
      A FIELD NOTHING READS DRIFTS SILENTLY AND LOOKS AUTHORITATIVE WHILE IT DOES.

      The gate is `Z8`: a category with no declared test FAILS, and an entry with no answer FAILS.
      Deliberately NOT a list of accepted phrases — that would be a regex in a data file, which is
      the shape #339 removed.
    categories:
      artwork-by-file:
        test: >
          WHAT DOES THE FILE DEPICT? A `fill=` in an illustration and a `fill=` in a UI icon are
          different questions, and the test is the file's purpose rather than the syntax it uses.
      forced-literal:
        test: >
          WHAT MAKES THE TOKEN FORM IMPOSSIBLE HERE? Name the mechanism, not the inconvenience.
      invariant:
        test: >
          ⚠ DOES IT HOLD WHEN THE GROUND MOVES, AND WHY MUST IT NOT MOVE? State the ground-change
          test explicitly. THIS KIND INHERITS `signature`'s FAILURE MODE — every entry that meant
          "this IS the design" was ruled on a one-theme site, which is to say the test was never
          run, and all three failed it when a second palette arrived.
      near-miss-kept:
        test: >
          WHAT IS THE MEASURED DISTANCE, OVER WHAT GROUND, AND WHY IS IT PAST THE SNAP THRESHOLD?
          The claim is a MEASUREMENT, so the prose carries its number or it is not this kind.
      adjacent:
        test: >
          WHICH SURFACE DOES IT REACH, AND WHY IS THAT SURFACE NOT THE PAGE?

          ⚠ `raster-baked` IS A REAL SHAPE AND IS DELIBERATELY NOT A CATEGORY. A colour in a webp
          and a colour in an OG card are both unreachable by static analysis, and they are not the
          same claim: adjacent is about WHERE the colour lands, raster-baked about WHAT FORM it is
          in. The eight Fosfor illustrations settled it — a raster-baked colour is FIXABLE by
          rebuilding the asset as inline SVG, so its correct treatment is REPAIR RATHER THAN
          EXEMPTION. A category for it would have zero members and would invite the next one to be
          excused instead of rebuilt.

# ---- ⚠ `signature` IS DELETED FROM THIS VOCABULARY, AND THE AUDIT IS WHY -----------------------
#
# It meant "a thing that IS the design rather than a skin on it". THREE ENTRIES GENUINELY MEANT IT —
# the custom cursor, the page loader ramp and the case-study hero auras — and ALL THREE FAILED THE
# GROUND-CHANGE TEST when a second palette arrived, because each was decoration that happened to be
# warm. All three were deleted rather than recategorised.
#
# The five entries still wearing the word each meant something else, which the #365 audit found by
# reading their prose against their label. ZERO CORRECT MEMBERS, AND A HUNDRED PERCENT FAILURE RATE
# AMONG THE TRUE ONES.
#
# ⚠ AND THE ONE THING THAT PASSES THE SIGNATURE TEST IS NOT IN THIS FILE AT ALL. The mark is
# COMPUTED — `theme-contrast` measures `--color-mark` and `--color-mark-on-dark` against their
# grounds — because invariance is a claim about whether a THEME MAY MOVE a colour, and this file is
# a list of colours nothing MEASURES. Those are different questions and one word was doing both.
# `invariant` above carries the first half; the contrast map carries the second.

# ---- RULES THAT GOVERN HOW A COLOUR IS JUDGED --------------------------------------------------
rules:
  - id: composite-not-declaration
    since: "#332"
    rule: >
      Judge a near-miss on the COMPOSITE distance over its real ground, not on the declaration.
      The composite tracks the alpha exactly — .11 to .14 gives about 1, .50 to .55 gives 4 to 5,
      .74 gives 5 to 7, and opacity 1 gives the declaration back.
    corrected_by: base-colour-highest-alpha

  - id: base-colour-highest-alpha
    since: "#338"
    rule: >
      A base colour is ruled ONCE, at its HIGHEST alpha — not once per occurrence.
    why: >
      ⚠ This is a CORRECTION to composite-not-declaration, not an addition beside it. That rule as
      approved carries this failure mode and did not say so. The vessel's oklch(0.94 0.025 40) is 5
      from cream-200 at .45 and 9 at .8, so judging per occurrence would snap the low-alpha use and
      leave the high one — PRODUCING TWO COLOURS WHERE THE DESIGN HAS ONE. That is the smoke-ramp
      and hero-word defect arriving through the composite rule rather than through a ramp.

  - id: artwork-by-file
    since: "#333"
    rule: >
      Artwork is excluded by what the FILE IS FOR, not by where the colour sits. A fill in an
      illustration and a fill in a UI icon are different questions.

  - id: two-sources-is-not-the-defect
    since: "#334"
    rule: >
      A component drawing from two colour sources is not itself wrong. SectionHeading's branches
      drew the same thing and disagreed, which was. The process diagram's outline is the drawing
      gesture and its fills depict a product screen — two sources, correctly.

# ---- THE ENTRIES -------------------------------------------------------------------------------
entries:
  # ---------------------------------------------------------------- mechanical
  - id: derived
    kind: mechanical
    entry_kind: category
    match: { form: "oklch(from var(--…) …) and color-mix() containing no literal" }
    reason: >
      ⚠ Relative colour syntax over a token is the MOST themed form a colour can take — strictly
      more themed than a plain var(). The census counted 14 of these as authored literals before
      #336, because the instrument built to replace a name-blind census was derivation-blind.
      Stripped by FORM, never by substring: a gradient with one token stop and one literal stop
      must still report the literal.

  - id: mask
    kind: mechanical
    entry_kind: category
    match: { property: "mask-image, -webkit-mask-image, mask" }
    reason: >
      ⚠ NOT A COLOUR AT ALL. #000 in a mask is an ALPHA CHANNEL — black means opaque. There is
      nothing to theme, which makes this different from every entry that is excluded because it
      must not change.

  - id: compiler-default
    kind: mechanical
    entry_kind: category
    match: { property: "--tw-*", also: "@supports color-mix fallbacks" }
    reason: >
      Tailwind emits a hex fallback beside every color-mix utility and initial values for its own
      custom properties. A browser that cannot do color-mix cannot do the theme either, so the
      fallback is not a themeable surface BY CONSTRUCTION rather than by exclusion.

  # ---------------------------------------------------------------- judgement
  - id: project-card-artwork
    kind: judgement
    category: artwork-by-file
    where: components/sections/ProjectCardSvgs.tsx
    count: 77
    files: [components/sections/ProjectCardSvgs.tsx]
    reason: >
      An illustration file. 77 of the site's 82 SVG colour attributes live here and are excluded
      whole, by what the file is for rather than by the syntax the colour is written in.
    test: >
      The file is an ILLUSTRATION SET — 77 of the site's 82 SVG colour attributes live in it, drawing
      product cards rather than interface. Its purpose is depiction, so every colour in it is excluded
      whole rather than attribute by attribute.

  - id: process-diagram-fills
    kind: judgement
    category: artwork-by-file
    where: components/sections/ProcessSection.tsx
    count: 3
    files: [components/sections/ProcessSection.tsx]
    reason: >
      ⚠ The accent OUTLINE is the drawing gesture — this site's hand, sketching — so it follows the
      palette. These three FILLS depict a product screen being designed: a wireframe of somebody
      else's interface, not a surface of this one. Theming them would make the depicted product
      change colour with the portfolio. Measured at 17, 54 and 73 from cream-300 before deciding.
    test: >
      The three fills DEPICT a product screen being designed, a wireframe of somebody else's
      interface. The accent OUTLINE around them is this site's hand sketching and it themes; the fills
      are the thing being drawn and they do not.

  - id: studio-chrome-and-property-defaults
    kind: mechanical
    category: ships-publicly-no-public-consumer
    where: app/globals.css (.studio-chrome and its descendants), Tailwind @property blocks
    selectors: [".studio-chrome", ".studio-chrome #studio-sidebar",
                ".studio-chrome #studio-sidebar::-webkit-scrollbar-thumb",
                ".studio-chrome #studio-sidebar::-webkit-scrollbar-thumb:hover",
                "property --tw-ring-offset-color"]
    reason: >
      The editor's own chrome, shipped in the one stylesheet Tailwind compiles, plus a Tailwind
      `@property` initial value whose "property" reads `property --tw-ring-offset-color` and so
      escapes the `--tw-` prefix test one syntax further out. Studio surfaces are outside the theme
      by construction (#323), and a compiler default is not authored colour.

  - id: about-photo-tint
    kind: judgement
    category: artwork-by-file
    where: app/globals.css (.ab-tint)
    count: 1
    selectors: [".ab-tint"]
    reason: >
      Measured before it was decided: mix-blend-mode soft-light at opacity .5 over a PHOTOGRAPH. A
      tonal wash rather than a scrim, compositing over artwork rather than the theme's ground, and
      it reads as photographic warmth. A cool theme keeps a warm-cast photo, deliberately.
    test: >
      It composites over a PHOTOGRAPH rather than over the theme's ground — mix-blend-mode soft-light
      at opacity .5 — so what it draws is a tonal wash on artwork, not a scrim on the site.
      Recategorised in #365, where the audit found its prose had argued artwork from the day it was
      written while its label said signature.

  - id: page-loader-fallback-ramp
    kind: judgement
    category: forced-literal
    where: components/motion/PageLoader.tsx (FALLBACK_SHADES)
    count: 8
    files: [components/motion/PageLoader.tsx]
    reason: >
      ⚠ THIS ROW REPLACES A SIGNATURE RULING THAT WAS WRONG, AND IT IS A NARROWER CLAIM THAN THE ONE
      IT REPLACES. The old entry excluded the loader's whole eight-colour ramp because it was "the
      brand arriving, not the site's surface — the same argument as the cursor, one moment earlier".
      That argument was made when one palette had ever shipped, so the test it claims to pass was
      never run. A full-screen terracotta curtain is the FIRST thing a harbour visitor sees.

      The ramp now derives from `--color-accent-500` and follows the theme, so it is no longer
      excluded at all. What remains is the FALLBACK the derivation fails closed to.

      ⚠ AND A FALLBACK CANNOT REFERENCE THE TOKEN WHOSE ABSENCE TRIGGERS IT. That is what makes this
      forced rather than a judgement about how the loader should look. If the accent cannot be read
      as OKLCH the eight literals paint, which is the pre-theme ramp preserved verbatim — the right
      thing to draw when the theme is exactly what could not be determined.

      It is unreachable on every engine that resolves the token, which is every engine the rest of
      the site already requires. Kept because a first-paint brand moment is the wrong place to
      discover a parse failure.
    test: >
      A fallback cannot reference the token whose absence triggers it. The derivation reads
      --color-accent-500; if that cannot be parsed as OKLCH these eight literals paint, which is the
      pre-theme ramp preserved verbatim. The mechanism is the impossibility, not the inconvenience.

  - id: device-mock-chrome
    kind: judgement
    category: artwork-by-file
    where: components/case-study/blocks/deviceScroller.ts
    count: 5
    files: [components/case-study/blocks/deviceScroller.ts]
    reason: >
      Phone and browser chrome around a product screenshot. It depicts a device, not this site.
    test: >
      Phone and browser chrome around a product screenshot. The file DEPICTS A DEVICE rather than this
      site, so its colours belong to the depicted object.

  - id: og-card-palette
    kind: judgement
    category: forced-literal
    where: lib/theme.ts (THEME_OG)
    count: 28
    files: [lib/theme.ts]
    reason: >
      ⚠ THE SOCIAL CARD'S FOUR COLOURS, RESOLVED PER THEME — TWENTY-FOUR VALUES ACROSS SIX ENTRIES.
      ⚠ AND THIS COUNT IS THE ONE THAT MOVES WHEN A THEME IS ADDED, four at a time, which is exactly
      what `count:` was made readable for in #363. It went 16 to 24 in #377 when cerise and fern arrived and 24 to 28 in #394 with sapphire; the original note said cerise and fern
      landed, and the census caught the stale figure before a human did.
      `ImageResponse` renders OUTSIDE the document and cannot read a CSS custom property, exactly as
      a favicon cannot, so a card's colours must exist as literals in JavaScript. Same forced form as
      `pwa-splash-ground` beside it, for the same mechanical reason.

      Until #370 the cards were not themed at all — `lib/og.tsx` held four module constants, three of
      which named a token and were 26.7, 34.8 and 30.7 away from it. #368 corrected them against
      cream; this makes them follow the published palette.

      ⚠ AND THE GROUND IS THEMED TOO, which is the part easy to miss: `cream-50` differs per palette,
      so theming only the accent would have drawn a teal mark on a warm card.
    test: >
      WHAT MAKES THE TOKEN FORM IMPOSSIBLE HERE: `ImageResponse` composes its own document with no
      access to the page's cascade, so `var(--color-accent-500)` resolves to nothing inside it. The
      value must be a literal or the card draws unstyled. That is the mechanism, not a preference —
      and `theme` section I compares all sixteen against their own theme's declaration in
      `globals.css`, so the duplication cannot drift silently.

  - id: pwa-splash-ground
    kind: judgement
    category: forced-literal
    where: lib/theme.ts (THEME_SPLASH)
    count: 7
    files: [lib/theme.ts]
    reason: >
      ⚠ THIS ROW EXISTED AS PROSE IN `lib/theme.ts` AND NOWHERE IN THIS FILE, WHICH IS WHY THE COUNT
      GATE FOUND IT. `pwa-chrome-colour` joins on the whole file, so these three were swept up by a
      row that rules on ONE colour and says so. J1 was satisfied, the record was short an entry, and
      the two facts looked identical from either side.

      `manifest.webmanifest` is JSON and cannot hold a `var()`, so a theme's splash ground is the one
      place it must exist as a literal in JavaScript. Each value is its theme's `--color-cream-50`
      resolved, not an approximation — the field held `#FBF6EE` for years, 5 from cream-50, which is
      #327's shape on the last surface that had it.

      FORCED, THEN, RATHER THAN A JUDGEMENT ABOUT HOW THE SPLASH SHOULD LOOK. It follows the theme by
      construction; what it cannot do is follow it through the token layer.
    test: >
      manifest.webmanifest is JSON and cannot hold a var(). That is the mechanism: the splash ground
      is the one place a theme's colour must exist as a literal in JavaScript. Each value is its
      theme's --color-cream-50 resolved, so it follows the palette by construction.

  - id: pwa-chrome-colour
    kind: judgement
    category: invariant
    where: lib/theme.ts (BRAND_CHROME_COLOR)
    count: 1
    files: [lib/theme.ts]
    reason: >
      ⚠ theme_color tints the Android address bar and the task-switcher card — the site's identity
      in SOMEONE ELSE'S FRAME. At 20 from every token it is its own near-black rather than a
      misspelling. A colour on a surface the site does not own does not follow the site's palette,
      and an address bar changing weekly reads as instability on the one surface a user sees BEFORE
      the site loads. Its sibling background_color IS themed, because that draws the site's own
      ground on the splash.
    test: >
      ⚠ THE GROUND-CHANGE TEST, RUN RATHER THAN ASSUMED: it must NOT move when the palette does.
      theme_color tints the Android address bar and the task-switcher card, a surface the site does
      not own and does not render, and an address bar changing colour weekly reads as instability on
      the one surface a user sees BEFORE the site loads. Holding still is the requirement rather than
      a side effect of nobody having themed it. Recategorised from signature in #365, where the audit
      found this prose was already the invariance argument the mark later won on.

  - id: global-error-page
    kind: judgement
    category: forced-literal
    where: app/global-error.tsx
    count: 6
    files: [app/global-error.tsx]
    reason: >
      ⚠ THE INVERSE OF EVERY OTHER ENTRY HERE. This renders WHEN THE APP HAS FAILED — the stylesheet
      may not have loaded, so var(--color-ink-950) resolving to nothing leaves an INVISIBLE PAGE at
      exactly the moment someone needs to read it. The cursor is excluded because it MUST NOT VARY;
      this is excluded because it CANNOT DEPEND ON ANYTHING THAT VARIES, and only the second gets
      MORE necessary as the rest of the system improves. A fully tokenised app is exactly the app
      whose error page must not use tokens.
    test: >
      The error page renders when the app's own CSS may not have loaded, so a var() there can resolve
      to nothing on exactly the surface that exists to stay legible when everything else failed. The
      impossibility is the failure mode it is written for.

  - id: studio-consumers-in-the-public-bundle
    kind: mechanical
    category: ships-publicly-no-public-consumer
    where: components/studio/CaseStudyItem.tsx, components/studio/SectionsEditPanel.tsx
    count: 3
    selectors_match: "escaped-arbitrary-utility"
    reason: >
      ⚠ THREE COLOURS THAT ARE IN THE PUBLIC STYLESHEET AND HAVE NO PUBLIC CONSUMER. Tailwind
      compiles one bundle, so `bg-[oklch(58%_0.17_30)]`, `bg-[oklch(62%_0.13_285)]` and a
      115-degree gradient arrive in the CSS every visitor downloads — while every element that uses
      them sits under the owner-gated /studio.
      ⚠ THE CENSUS CANNOT SEE THIS FROM THE SELECTOR, and that is the finding rather than the rows.
      A utility class carries no studio marker; its studio-ness lives in the CONSUMER. This is the
      mirror of the project's emission rule — ask where a cost is EMITTED, not where the feature is
      USED — pointed the other way: the census reads what is emitted and cannot tell who uses it.
      ⚠ AND WHAT IT IMPLIES: they are unthemeable AND unreachable. A theme cannot move them and no
      visitor sees them, so they are not a leak in either direction. Recording them is honest;
      fixing them is a bundle-size question rather than this arc's work — #274 already measured that
      seam at 23.4% of the stylesheet, and these are the same finding at colour granularity.
      The census RESOLVES the consumer rather than excluding by lookup, because excluding would bury
      a judgement inside a filter — the shape categories-as-data was built to remove.

  - id: step-1b-near-literals
    kind: judgement
    category: near-miss-kept
    where: components/sections/AboutSection.tsx, components/sections/ContactSection.tsx
    files: [components/sections/AboutSection.tsx, components/sections/ContactSection.tsx]
    count: 3
    reason: >
      ⚠ THE NINE Δ≥10 NEARS THE SNAP RULING LEFT AS LITERALS — named in this file's header from the
      day it was written, and NEVER GIVEN AN ENTRY. The join found that: a category declared in
      prose and absent from the data is exactly what categories-as-data was built to remove, and it
      survived because nothing joined against it until #356.
      `#5F584E` was re-measured under the composite rule that superseded Step 1b's method and did
      NOT move — opaque, so composite equals declaration, and 10 from `ink-600`, the leave-as-literal
      boundary. The verdict stands, and the member most likely to have shifted did not, which is why
      the other eight are not re-opened as a group.
    test: >
      MEASURED AND KEPT, and the number is the claim. #5F584E re-measured under the composite rule at
      delta 11 from ink-600 over its own ground, past the snap threshold this project settled at
      single digits; the other two were measured the same way in #340. Without the number this is not
      this kind.

  - id: component-shadow-tints
    kind: judgement
    category: forced-literal
    where: components/case-study/blocks/BeforeAfterStory.tsx, components/sections/HeroSection.tsx
    files: [components/case-study/blocks/BeforeAfterStory.tsx, components/sections/HeroSection.tsx]
    count: 2
    reason: >
      Two components roll their own shadow tint instead of using `--shadow-sm/md/lg`, which are
      already tokenised from `ink-950`. Measured against that token as the composite rule requires:
      7 and 8 — outside the snap threshold, so they are their own tints rather than misspellings.
      ⚠ AND THE REAL QUESTION IS NOT COLOUR. `--shadow-*` carries offset and blur as well as tint, so
      adopting it here changes the shadow's GEOMETRY, not just its hue. That is a shadow-token
      adoption question with its own before-and-after, and folding it into a colour sweep would be
      the wrong-noun error this arc has made four times.
      ⚠ AND THE TRIGGER IS NAMED RATHER THAN LEFT AS "SEPARATE", because a deferral conditional on
      nothing has no owner and this project has recorded that twice. REVISIT WHEN either something
      else needs these shadows — a third component reaching for a bespoke tint means the tokens are
      not covering the need — OR when a theme makes a warm drop-shadow read wrong on a cool ground,
      which is the same test the cursor and the loader failed.
    test: >
      Adopting --shadow-sm/md/lg is impossible without changing what is drawn: those tokens carry
      OFFSET AND BLUR as well as tint, so taking them here changes the shadow's GEOMETRY and not only
      its colour. The mechanism is that the token is not a colour token. Measured at 7 and 8 from
      ink-950, outside the snap threshold, so they are their own tints as well.

  - id: favicon-mark
    kind: judgement
    category: invariant
    where: app/icon0.svg
    count: 4
    files: [app/icon0.svg]
    reason: >
      ⚠ THE MARK IS NEUTRAL, AND THE MEASUREMENT IS WHY RATHER THAN A PREFERENCE. Four grey values,
      chroma ZERO, so it belongs to no palette and there is nothing left for a theme to move.

      A favicon is fetched outside the document, so an SVG served as one cannot see the page's
      custom properties — measured in #365 by rasterisation. So "themed favicon" would have meant a
      per-theme ASSET. #367 priced that and it was buildable: `sharp` is already a dependency and
      rasterises this file at every size in under 20ms, mean difference 2.6 from the hand export.

      ⚠ IT WAS PRICED AND REFUSED, ON TWO MEASUREMENTS. The GROUND cannot carry a theme at all — the
      two candidate grounds are both near-black at L≈0.17, 25.1 apart, and at 16 to 64px that hue is
      imperceptible. And neutral is the MOST LEGIBLE option at the size that matters: 16.49 against
      6.52 for the terracotta mark and 7.79 for a fully themed one. Legible mark pixels at 16px went
      12 to 25.

      Giving up the accent here costs least and buys most, which is the opposite of how that trade
      usually reads.
    test: >
      ⚠ THE GROUND-CHANGE TEST: it must NOT move when the palette does, and here there is nothing to
      move — every value is chroma 0. That is stronger than the previous form, which held only
      because the cascade could not reach the file. A neutral mark on a tab strip beside a dozen
      other tabs holds still because it has no hue to change, not because nobody themed it.

  - id: adjacent-surfaces
    kind: judgement
    category: adjacent
    where: lib/og.tsx
    count: 4
    files: [lib/og.tsx, app/manifest.ts]
    reason: >
      Social cards. They reach a surface adjacent to the page rather than the page itself, and they
      are baked into an image at build time — a fifth route no static analysis of the page reaches.
    test: >
      SOCIAL CARDS. They reach a feed, a message preview or a link unfurl — a surface rendered by
      someone else's client and never by this page — and they are baked into an image at build time, a
      fifth route no static analysis of the page reaches. Recategorised from signature in #365; the
      prose already argued adjacency and the label never did.

