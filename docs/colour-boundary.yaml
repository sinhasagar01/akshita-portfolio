  - id: og-card-palette
    kind: judgement
    category: forced-literal
    where: lib/theme.ts (THEME_OG)
    count: 44
    files: [lib/theme.ts]
    reason: >
      ⚠ THE SOCIAL CARD'S FOUR COLOURS, RESOLVED PER THEME — TWENTY-FOUR VALUES ACROSS SIX ENTRIES.
      ⚠ AND THIS COUNT IS THE ONE THAT MOVES WHEN A THEME IS ADDED, four at a time, which is exactly
      what `count:` was made readable for in #363. It went 16 to 24 in #377 when cerise and fern arrived and 24 to 28 in #394 with sapphire; the original note said cerise and fern
      landed, and the census caught the stale figure before a human did. It moved 28 to 40 when the
      three dark presets arrived, four each — and the census caught that too, which is what a field
      somebody actually reads looks like rather than one that decorates a row.
      `ImageResponse` renders OUTSIDE the document and cannot read a CSS custom property, exactly as
      a favicon cannot, so a card's colours must exist as literals in JavaScript. Same forced form as
      `pwa-splash-ground` beside it, for the same mechanical reason.

      Until #370 the cards were not themed at all — `lib/og.tsx` held four module constants, three of
      which named a token and were 26.7, 34.8 and 30.7 away from it. #368 corrected them against
      cream; this makes them follow the published palette.

      ⚠ AND THE GROUND IS THEMED TOO, which is the part easy to miss: `cream-50` differs per palette,
      so theming only the accent would have drawn a teal mark on a warm card.
    test: >
      WHAT MAKES THE TOKEN FORM IMPOSSIBLE HERE: `ImageResponse` composes its own document with no
      access to the page's cascade, so `var(--color-accent-500)` resolves to nothing inside it. The
      value must be a literal or the card draws unstyled. That is the mechanism, not a preference —
      and `theme` section I compares all sixteen against their own theme's declaration in
      `globals.css`, so the duplication cannot drift silently.

  - id: pwa-splash-ground
    kind: judgement
    category: forced-literal
